<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>File Transfer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 25px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

button,
input {
    width: 100%;
    height: 46px;
    border-radius: 9px;
    font-size: 16px;
}

button {
    border: 0;
    background: #222;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

button:disabled {
    opacity: .5;
}

input {
    border: 1px solid #ccc;
    padding: 0 12px;
    background: white;
}

.success {
    background: #16803c;
}

.danger {
    background: #c62828;
}

.secondary {
    background: #777;
}

.code {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 7px;
    margin: 18px 0;
}

.center {
    text-align: center;
}

.file {
    background: #f1f1f1;
    padding: 13px;
    border-radius: 9px;
    word-break: break-word;
}

.status {
    text-align: center;
    color: #666;
    margin-top: 15px;
}

.error {
    color: #c62828;
    margin-top: 10px;
}

.success-text {
    color: #16803c;
}

.actions {
    display: flex;
    gap: 10px;
}

.actions button {
    width: 50%;
}

.progress {
    height: 8px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #222;
}

.small {
    color: #777;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

<!-- HOME -->

<div id="home" class="page active">

    <h1>File Transfer</h1>

    <div class="card">

        <button id="sendBtn">
            Kirim
        </button>

        <button id="receiveBtn">
            Terima
        </button>

    </div>

</div>


<!-- SEND -->

<div id="send" class="page">

    <h1>Kirim File</h1>

    <div class="card">

        <p>
            Pilih satu file.
        </p>

        <input
            id="fileInput"
            type="file"
        >

        <button id="uploadBtn">
            Upload
        </button>

        <div
            id="progressBox"
            class="progress"
            style="display:none"
        >
            <div
                id="progressBar"
                class="progress-bar"
            ></div>
        </div>

        <p
            id="uploadStatus"
            class="status"
        ></p>

        <p
            id="uploadError"
            class="error"
        ></p>

    </div>

    <button
        id="sendBack"
        class="secondary"
    >
        Kembali
    </button>

</div>


<!-- HOST ROOM -->

<div id="host" class="page">

    <h1>Room</h1>

    <div class="card center">

        <div class="small">
            Kode Room
        </div>

        <div
            id="hostCode"
            class="code"
        >
            ------
        </div>

        <div
            id="hostFile"
            class="file"
        >
            -
        </div>

        <div
            id="hostStatus"
            class="status"
        >
            Menunggu penerima...
        </div>

    </div>


    <div
        id="requestCard"
        class="card"
        style="display:none"
    >

        <h3>
            Permintaan Masuk
        </h3>

        <p>
            <b id="requestName">
                -
            </b>
            ingin masuk ke room.
        </p>

        <div class="actions">

            <button
                id="rejectBtn"
                class="danger"
            >
                Tolak
            </button>

            <button
                id="acceptBtn"
                class="success"
            >
                Terima
            </button>

        </div>

    </div>


    <div
        id="acceptedCard"
        class="card"
        style="display:none"
    >

        <h3>
            Penerima
        </h3>

        <p>
            <b id="acceptedName">
                -
            </b>
            sudah diterima.
        </p>

    </div>


    <button
        id="deleteRoomBtn"
        class="danger"
    >
        Hapus Room
    </button>

</div>


<!-- RECEIVE -->

<div id="receive" class="page">

    <h1>Terima File</h1>

    <div class="card">

        <label>
            Kode Room
        </label>

        <input
            id="codeInput"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="6 digit"
        >

        <br><br>

        <label>
            Nama
        </label>

        <input
            id="nameInput"
            type="text"
            maxlength="30"
            placeholder="Nama kamu"
        >

        <button id="joinBtn">
            Kirim Permintaan
        </button>

        <p
            id="joinError"
            class="error"
        ></p>

    </div>

    <button
        id="receiveBack"
        class="secondary"
    >
        Kembali
    </button>

</div>


<!-- WAITING -->

<div id="waiting" class="page">

    <h1>Menunggu</h1>

    <div class="card center">

        <p>
            Permintaan sudah dikirim.
        </p>

        <div
            id="waitingCode"
            class="code"
        >
            ------
        </div>

        <p
            id="waitingStatus"
            class="status"
        >
            Menunggu host menerima...
        </p>

    </div>

</div>


<!-- DOWNLOAD -->

<div id="download" class="page">

    <h1>File Siap</h1>

    <div class="card center">

        <div class="small">
            Room
        </div>

        <div
            id="downloadCode"
            class="code"
        >
            ------
        </div>

        <div
            id="downloadFile"
            class="file"
        >
            -
        </div>

        <button id="downloadBtn">
            Download
        </button>

        <p
            id="downloadStatus"
            class="status"
        ></p>

    </div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
    "https://juuoofdtpsbvgjfwtuvy.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_guhUiQKd6KYCab6J94B2_A_1GT9P7rg";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   STATE
================================================== */

let currentUser = null;

let hostRoomId = null;

let hostChannel = null;

let receiverRoomId = null;

let receiverChannel = null;


/* ==================================================
   PAGE
================================================== */

const pages =
    document.querySelectorAll(".page");


function showPage(page) {

    pages.forEach(
        p => p.classList.remove("active")
    );

    page.classList.add("active");

}


/* ==================================================
   AUTH
================================================== */

async function initializeAuth() {

    const {
        data: {
            session
        }
    } =
    await supabase.auth.getSession();


    if (
        session &&
        session.user
    ) {

        currentUser =
            session.user;

        return;

    }


    const {
        data,
        error
    } =
    await supabase.auth.signInAnonymously();


    if (error) {

        console.error(error);

        alert(
            "Gagal menghubungkan ke Supabase:\n" +
            error.message
        );

        return;

    }


    currentUser =
        data.user;

}


initializeAuth();


/* ==================================================
   ELEMENT
================================================== */

const home =
    document.getElementById("home");

const send =
    document.getElementById("send");

const host =
    document.getElementById("host");

const receive =
    document.getElementById("receive");

const waiting =
    document.getElementById("waiting");

const download =
    document.getElementById("download");


/* ==================================================
   HOME
================================================== */

document
.getElementById("sendBtn")
.onclick =
function() {

    showPage(send);

};


document
.getElementById("receiveBtn")
.onclick =
function() {

    document.getElementById("codeInput")
        .value = "";

    document.getElementById("nameInput")
        .value = "";

    document.getElementById("joinError")
        .textContent = "";

    showPage(receive);

};


/* ==================================================
   BACK
================================================== */

document
.getElementById("sendBack")
.onclick =
function() {

    showPage(home);

};


document
.getElementById("receiveBack")
.onclick =
function() {

    showPage(home);

};


/* ==================================================
   GENERATE CODE
================================================== */

function generateCode() {

    return String(
        Math.floor(
            100000 +
            Math.random() * 900000
        )
    );

}


/* ==================================================
   UPLOAD
================================================== */

document
.getElementById("uploadBtn")
.onclick =
async function() {

    const file =
        document.getElementById(
            "fileInput"
        ).files[0];


    const errorBox =
        document.getElementById(
            "uploadError"
        );

    const statusBox =
        document.getElementById(
            "uploadStatus"
        );

    const progressBox =
        document.getElementById(
            "progressBox"
        );

    const progressBar =
        document.getElementById(
            "progressBar"
        );

    const uploadBtn =
        document.getElementById(
            "uploadBtn"
        );


    errorBox.textContent = "";

    statusBox.textContent = "";


    if (!file) {

        errorBox.textContent =
            "Pilih file terlebih dahulu.";

        return;

    }


    if (!currentUser) {

        errorBox.textContent =
            "Masih menghubungkan ke Supabase.";

        return;

    }


    uploadBtn.disabled = true;

    progressBox.style.display =
        "block";

    progressBar.style.width =
        "0%";


    try {

        /* ------------------------------------------
           Buat room
        ------------------------------------------ */

        let code;

        let roomData;

        let roomError;

        let attempts = 0;


        do {

            code =
                generateCode();


            const result =
                await supabase
                    .from("rooms")
                    .insert({

                        code: code,

                        host_id:
                            currentUser.id,

                        file_name:
                            file.name,

                        file_path:
                            "",

                        file_size:
                            file.size,

                        status:
                            "waiting",

                        requester_id:
                            null,

                        requester_name:
                            null,

                        request_status:
                            null

                    })
                    .select()
                    .single();


            roomData =
                result.data;

            roomError =
                result.error;


            attempts++;

        }
        while (
            roomError &&
            attempts < 5
        );


        if (roomError) {

            throw roomError;

        }


        hostRoomId =
            roomData.id;


        /* ------------------------------------------
           Path file
        ------------------------------------------ */

        const filePath =
            hostRoomId +
            "/" +
            file.name;


        /* ------------------------------------------
           Upload
        ------------------------------------------ */

        const {
            error:
            storageError
        } =
        await supabase
            .storage
            .from("files")
            .upload(
                filePath,
                file,
                {
                    upsert: false
                }
            );


        if (storageError) {

            await supabase
                .from("rooms")
                .delete()
                .eq(
                    "id",
                    hostRoomId
                );

            throw storageError;

        }


        /* ------------------------------------------
           Simpan path
        ------------------------------------------ */

        const {
            error:
            updateError
        } =
        await supabase
            .from("rooms")
            .update({

                file_path:
                    filePath

            })
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            );


        if (updateError) {

            throw updateError;

        }


        /* ------------------------------------------
           Host UI
        ------------------------------------------ */

        document
            .getElementById(
                "hostCode"
            )
            .textContent =
                code;


        document
            .getElementById(
                "hostFile"
            )
            .textContent =
                file.name;


        document
            .getElementById(
                "hostStatus"
            )
            .textContent =
                "Menunggu penerima...";


        document
            .getElementById(
                "requestCard"
            )
            .style.display =
                "none";


        document
            .getElementById(
                "acceptedCard"
            )
            .style.display =
                "none";


        showPage(host);


        listenHostRoom();


    }
    catch(error) {

        console.error(error);

        errorBox.textContent =
            error.message;

    }


    uploadBtn.disabled =
        false;

};


/* ==================================================
   HOST REALTIME
================================================== */

function listenHostRoom() {

    if (hostChannel) {

        supabase
            .removeChannel(
                hostChannel
            );

    }


    hostChannel =
        supabase
            .channel(
                "host-room-" +
                hostRoomId
            )
            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "rooms",
                    filter:
                        "id=eq." +
                        hostRoomId
                },
                function(payload) {

                    const room =
                        payload.new;


                    if (
                        room.request_status ===
                        "pending"
                    ) {

                        document
                            .getElementById(
                                "requestName"
                            )
                            .textContent =
                                room.requester_name;


                        document
                            .getElementById(
                                "requestCard"
                            )
                            .style.display =
                                "block";


                        document
                            .getElementById(
                                "acceptedCard"
                            )
                            .style.display =
                                "none";


                        document
                            .getElementById(
                                "hostStatus"
                            )
                            .textContent =
                                "Ada permintaan masuk.";

                    }


                    if (
                        room.request_status ===
                        "rejected"
                    ) {

                        document
                            .getElementById(
                                "requestCard"
                            )
                            .style.display =
                                "none";


                        document
                            .getElementById(
                                "hostStatus"
                            )
                            .textContent =
                                "Permintaan ditolak.";

                    }


                    if (
                        room.request_status ===
                        "accepted"
                    ) {

                        document
                            .getElementById(
                                "acceptedName"
                            )
                            .textContent =
                                room.requester_name;


                        document
                            .getElementById(
                                "acceptedCard"
                            )
                            .style.display =
                                "block";


                        document
                            .getElementById(
                                "requestCard"
                            )
                            .style.display =
                                "none";


                        document
                            .getElementById(
                                "hostStatus"
                            )
                            .textContent =
                                "Penerima sudah diterima.";

                    }

                }
            )
            .subscribe();

}


/* ==================================================
   PENERIMA CARI ROOM
================================================== */

document
.getElementById("joinBtn")
.onclick =
async function() {

    const code =
        document
            .getElementById(
                "codeInput"
            )
            .value
            .trim();


    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();


    const errorBox =
        document
            .getElementById(
                "joinError"
            );


    errorBox.textContent = "";


    if (!/^\d{6}$/.test(code)) {

        errorBox.textContent =
            "Kode harus 6 digit.";

        return;

    }


    if (!name) {

        errorBox.textContent =
            "Masukkan nama.";

        return;

    }


    if (!currentUser) {

        errorBox.textContent =
            "Masih menghubungkan ke Supabase.";

        return;

    }


    const joinBtn =
        document.getElementById(
            "joinBtn"
        );


    joinBtn.disabled = true;


    try {

        /* ------------------------------------------
           Cari room melalui RPC
        ------------------------------------------ */

        const {
            data,
            error
        } =
        await supabase
            .rpc(
                "find_room_by_code",
                {
                    p_code: code
                }
            );


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            throw new Error(
                "Room tidak ditemukan atau sudah tidak tersedia."
            );

        }


        const room =
            data[0];


        /* ------------------------------------------
           Kirim request
        ------------------------------------------ */

        const {
            data:
                requestAccepted,
            error:
                requestError
        } =
        await supabase
            .rpc(
                "request_room",
                {
                    p_room_id:
                        room.id,

                    p_name:
                        name
                }
            );


        if (requestError) {

            throw requestError;

        }


        if (!requestAccepted) {

            throw new Error(
                "Room baru saja digunakan oleh penerima lain."
            );

        }


        receiverRoomId =
            room.id;


        document
            .getElementById(
                "waitingCode"
            )
            .textContent =
                code;


        document
            .getElementById(
                "waitingStatus"
            )
            .textContent =
                "Menunggu host menerima...";


        showPage(waiting);


        listenReceiverRoom();

    }
    catch(error) {

        console.error(error);

        errorBox.textContent =
            error.message;

    }


    joinBtn.disabled =
        false;

};


/* ==================================================
   PENERIMA REALTIME
================================================== */

function listenReceiverRoom() {

    if (receiverChannel) {

        supabase
            .removeChannel(
                receiverChannel
            );

    }


    receiverChannel =
        supabase
            .channel(
                "receiver-room-" +
                receiverRoomId
            )
            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "rooms",
                    filter:
                        "id=eq." +
                        receiverRoomId
                },
                async function(payload) {

                    const room =
                        payload.new;


                    if (
                        room.request_status ===
                        "rejected"
                    ) {

                        document
                            .getElementById(
                                "waitingStatus"
                            )
                            .textContent =
                                "Permintaan ditolak host.";

                        return;

                    }


                    if (
                        room.request_status ===
                        "accepted"
                    ) {

                        document
                            .getElementById(
                                "downloadCode"
                            )
                            .textContent =
                                room.code;


                        document
                            .getElementById(
                                "downloadFile"
                            )
                            .textContent =
                                room.file_name;


                        document
                            .getElementById(
                                "downloadStatus"
                            )
                            .textContent =
                                "Akses diterima.";

                        showPage(download);

                    }

                }
            )
            .subscribe();

}


/* ==================================================
   HOST TERIMA
================================================== */

document
.getElementById("acceptBtn")
.onclick =
async function() {

    if (!hostRoomId) return;


    const {
        error
    } =
    await supabase
        .from("rooms")
        .update({

            request_status:
                "accepted",

            status:
                "accepted"

        })
        .eq(
            "id",
            hostRoomId
        )
        .eq(
            "host_id",
            currentUser.id
        );


    if (error) {

        alert(
            "Gagal menerima:\n" +
            error.message
        );

    }

};


/* ==================================================
   HOST TOLAK
================================================== */

document
.getElementById("rejectBtn")
.onclick =
async function() {

    if (!hostRoomId) return;


    const {
        error
    } =
    await supabase
        .from("rooms")
        .update({

            request_status:
                "rejected"

        })
        .eq(
            "id",
            hostRoomId
        )
        .eq(
            "host_id",
            currentUser.id
        );


    if (error) {

        alert(
            "Gagal menolak:\n" +
            error.message
        );

    }

};


/* ==================================================
   DOWNLOAD
================================================== */

document
.getElementById("downloadBtn")
.onclick =
async function() {

    if (!receiverRoomId) {

        return;

    }


    const button =
        document.getElementById(
            "downloadBtn"
        );

    const status =
        document.getElementById(
            "downloadStatus"
        );


    button.disabled = true;

    status.textContent =
        "Menyiapkan download...";


    try {

        /*
        ------------------------------------------
        Ambil room lagi.
        RLS hanya mengizinkan penerima
        yang sudah memiliki request.
        ------------------------------------------
        */

        const {
            data: room,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select(
                "file_path,file_name,request_status"
            )
            .eq(
                "id",
                receiverRoomId
            )
            .single();


        if (roomError) {

            throw roomError;

        }


        if (
            room.request_status !==
            "accepted"
        ) {

            throw new Error(
                "Akses download belum diberikan."
            );

        }


        /*
        ------------------------------------------
        Signed URL 10 menit
        ------------------------------------------
        */

        const {
            data,
            error
        } =
        await supabase
            .storage
            .from("files")
            .createSignedUrl(
                room.file_path,
                600,
                {
                    download:
                        room.file_name
                }
            );


        if (error) {

            throw error;

        }


        status.textContent =
            "Download dimulai.";


        const link =
            document.createElement(
                "a"
            );

        link.href =
            data.signedUrl;

        link.download =
            room.file_name;

        document
            .body
            .appendChild(link);

        link.click();

        link.remove();

    }
    catch(error) {

        console.error(error);

        status.textContent =
            "Gagal download: " +
            error.message;

    }


    button.disabled =
        false;

};


/* ==================================================
   HAPUS ROOM
================================================== */

document
.getElementById("deleteRoomBtn")
.onclick =
async function() {

    if (!hostRoomId) return;


    const yakin =
        confirm(
            "Hapus room dan file?"
        );


    if (!yakin) return;


    const button =
        document.getElementById(
            "deleteRoomBtn"
        );


    button.disabled = true;


    try {

        /*
        ------------------------------------------
        Ambil path file
        ------------------------------------------
        */

        const {
            data: roomData,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select(
                "file_path"
            )
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            )
            .single();


        if (roomError) {

            throw roomError;

        }


        /*
        ------------------------------------------
        Hapus file DULU
        ------------------------------------------
        */

        if (
            roomData &&
            roomData.file_path
        ) {

            const {
                error:
                    storageError
            } =
            await supabase
                .storage
                .from("files")
                .remove([
                    roomData.file_path
                ]);


            if (storageError) {

                throw storageError;

            }

        }


        /*
        ------------------------------------------
        Baru hapus room
        ------------------------------------------
        */

        const {
            error:
                deleteError
        } =
        await supabase
            .from("rooms")
            .delete()
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            );


        if (deleteError) {

            throw deleteError;

        }


        /*
        ------------------------------------------
        Stop realtime
        ------------------------------------------
        */

        if (hostChannel) {

            await supabase
                .removeChannel(
                    hostChannel
                );

            hostChannel = null;

        }


        hostRoomId = null;


        alert(
            "Room dan file berhasil dihapus."
        );


        showPage(home);

    }
    catch(error) {

        console.error(error);

        alert(
            "Gagal menghapus:\n" +
            error.message
        );

    }


    button.disabled =
        false;

};

</script>
