<style>

/* ========================================================
   FILE TRANSFER
======================================================== */

html,
body {
    max-width: 100%;
    overflow-x: hidden;
}

h2 {
    font-size: 2em;
    text-align: center;
    margin: 8px;
}

.ft-page {

    width: 95%;

    max-width: 720px;

    box-sizing: border-box;

    margin: 0 auto;

    padding:
        62px
        12px
        24px;

    color: var(--text);

}

.ft-page *,
.ft-page *::before,
.ft-page *::after {

    box-sizing: border-box;

}

.ft-page h1 {

    color: var(--accent);

    font-family:
        minecraft,
        Arial,
        sans-serif;

    text-align: center;

    font-size: 2.2em;

    margin:
        0 0 20px;

    text-shadow:
        0 1px 0 rgba(255,255,255,.4),
        0 4px 0 var(--daccent);

    letter-spacing: 1px;

}

.ft-page .ft-page-view {

    display: none;

}

.ft-page .ft-page-view.active {

    display: block;

}

.ft-page .ft-card {

    background: var(--card);

    color: var(--text);

    border-radius: 8px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.4);

}

.ft-page .ft-center {

    text-align: center;

}

.ft-page .ft-small {

    font-size: 14px;

    color: var(--text2);

}

.ft-page label {

    font-weight: bold;

}

.ft-page input[type="file"] {

    display: block;

    width: 100%;

    min-height: 45px;

    padding: 5px;

    border:
        2px solid
        var(--accent);

    background:
        var(--sp);

    color:
        var(--text);

    border-radius: 8px;

}

.ft-page input[type="file"]::file-selector-button {

    background:
        var(--accent);

    border: none;

    border-radius: 5px;

    padding:
        6px
        8px;

    font-weight: bold;

    color: white;

    margin-right: 8px;

}

.ft-page .ft-code {

    font-size: 36px;

    font-weight: bold;

    letter-spacing: 6px;

    margin:
        18px 0;

    color:
        var(--accent);

}

.ft-page .ft-file {

    background:
        var(--sp);

    color:
        var(--text);

    padding: 12px;

    border-radius: 8px;

    word-break: break-word;

}

.ft-page .ft-status {

    text-align: center;

    color: var(--text2);

    margin-top: 15px;

}

.ft-page .ft-error {

    color: #e53935;

    margin-top: 10px;

}

.ft-page .ft-info {

    text-align: center;

    padding: 10px;

    color: var(--text2);

}

.ft-page .ft-request {

    border:
        1px solid
        var(--border);

    border-radius: 10px;

    padding: 15px;

    margin-top: 15px;

}

.ft-page .ft-request-name {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 5px;

}

.ft-page .ft-actions {

    display: flex;

    gap: 10px;

}

.ft-page .ft-actions button {

    flex: 1;

}

.ft-page .ft-progress-container {

    width: 100%;

    height: 8px;

    background:
        var(--border);

    border-radius: 10px;

    overflow: hidden;

    margin-top: 15px;

}

.ft-page .ft-progress {

    height: 100%;

    width: 0%;

    background:
        var(--accent);

    transition:
        width .2s ease;

}

.ft-page .ft-hidden {

    display: none !important;

}

.ft-page button,
.ft-page input[type="text"],
.ft-page input[type="file"] {

    width: 100%;

    min-height: 45px;

    border-radius: 8px;

    font-size: 16px;

}

.ft-page button {

    border: none;

    background:
        var(--accent);

    color: white;

    cursor: pointer;

    margin-top: 10px;

    padding:
        10px
        14px;

    font-weight: bold;

    transition:
        opacity .2s ease,
        transform .1s ease;

}

.ft-page button:hover {

    opacity: .9;

}

.ft-page button:active {

    transform:
        translateY(1px);

}

.ft-page button:disabled {

    opacity: .5;

    cursor: not-allowed;

}

.ft-page button.ft-success {

    background:
        #2e7d32;

}

.ft-page button.ft-danger {

    background:
        #d32f2f;

}

.ft-page button.ft-secondary {

    background:
        var(--ph);

    color: #fff;

}

.ft-page input[type="text"] {

    border:
        2px solid
        var(--accent);

    padding:
        10px;

    background:
        var(--sp);

    color:
        var(--text);

    outline: none;

}

.ft-page input[type="text"]:focus {

    border-color:
        var(--accent);

}

.ft-page input::placeholder {

    color:
        var(--ph);

}

.ft-request-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

}

.ft-request-item {

    border:
        1px solid
        var(--border);

    border-radius:
        10px;

    padding:
        15px;

}

.ft-request-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

}

.ft-request-status {

    font-size:
        12px;

    padding:
        4px 8px;

    border-radius:
        20px;

    background:
        var(--sp);

}

.ft-request-status.pending {

    color:
        var(--accent);

}

.ft-request-status.accepted {

    color:
        #2e7d32;

}

.ft-request-status.rejected {

    color:
        #d32f2f;

}

.ft-request-status.cancelled {

    color:
        var(--text2);

}

.ft-empty {

    text-align:
        center;

    color:
        var(--text2);

    padding:
        10px;

}

@media (max-width: 600px) {

    .ft-page {

        padding:
            58px
            10px
            20px;

    }

    .ft-page h1 {

        font-size:
            1.9em;

    }

    .ft-page .ft-card {

        padding:
            15px;

    }

    .ft-page .ft-code {

        font-size:
            30px;

    }

    .ft-request-header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }

}

</style>

<script type="module">


/* ========================================================
   SUPABASE
======================================================== */

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://juuoofdtpsbvgjfwtuvy.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_guhUiQKd6KYCab6J94B2_A_1GT9P7rg";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ========================================================
   GLOBAL
======================================================== */

let currentUser = null;

let hostRoomId = null;

let receiverRoomId = null;

let receiverRequestId = null;

let hostPoll = null;

let receiverPoll = null;


/* ========================================================
   ELEMENT
======================================================== */

const pages =
    document.querySelectorAll(
        ".ft-page-view"
    );


const homePage =
    document.getElementById(
        "homePage"
    );

const sendPage =
    document.getElementById(
        "sendPage"
    );

const hostPage =
    document.getElementById(

    );

const receivePage =
    document.getElementById(
        "receivePage"
    );

const waitingPage =
    document.getElementById(
        "waitingPage"
    );

const downloadPage =
    document.getElementById(
        "downloadPage"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );

const receiveButton =
    document.getElementById(
        "receiveButton"
    );

const backSendButton =
    document.getElementById(
        "backSendButton"
    );

const backReceiveButton =
    document.getElementById(
        "backReceiveButton"
    );


const fileInput =
    document.getElementById(
        "fileInput"
    );

const uploadButton =
    document.getElementById(
        "uploadButton"
    );

const uploadStatus =
    document.getElementById(
        "uploadStatus"
    );

const uploadError =
    document.getElementById(
        "uploadError"
    );

const progressContainer =
    document.getElementById(
        "progressContainer"
    );

const progress =
    document.getElementById(
        "progress"
    );


const hostCode =
    document.getElementById(
        "hostCode"
    );

const hostFile =

    );

const hostStatus =

    );

const roomExpiry =

        "roomExpiry"
    );


const requestList =
    document.getElementById(
        "requestList"
    );

const requestEmpty =
    document.getElementById(
        "requestEmpty"
    );


const deleteRoomButton =
    document.getElementById(
        "deleteRoomButton"
    );


const codeInput =
    document.getElementById(
        "codeInput"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const joinError =
    document.getElementById(
        "joinError"
    );


const waitingCode =
    document.getElementById(
        "waitingCode"
    );

const waitingStatus =
    document.getElementById(
        "waitingStatus"
    );

const cancelRequestButton =
    document.getElementById(

    );


const downloadCode =
    document.getElementById(

    );

const downloadFile =

    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const downloadStatus =
    document.getElementById(
        "downloadStatus"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


/* ========================================================
   PAGE
======================================================== */

function showPage(page) {

    pages.forEach(
        function(item) {

            item.classList.remove(
                "active"
            );

        }
    );

    page.classList.add(
        "active"
    );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ========================================================
   CODE
======================================================== */

function generateCode() {

    return Math.floor(
        100000 +
        Math.random() * 900000
    ).toString();

}


/* ========================================================
   FILE NAME
======================================================== */

function safeFileName(name) {

    return name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );

}


/* ========================================================
   FORMAT TIME
======================================================== */

function formatExpiry(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
        new Date(dateString);

    return (
        "Room berlaku sampai " +
        date.toLocaleTimeString(
            "id-ID",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        )
    );

}


/* ========================================================
   AUTH
======================================================== */

async function initAuth() {

    try {

        const {
            data,
            error
        } =
        await supabase.auth.getSession();


        if (error) {
            throw error;
        }


        if (
            data &&
            data.session &&
            data.session.user
        ) {

            currentUser =
                data.session.user;

        }
        else {

            const result =
                await supabase.auth
                    .signInAnonymously();


            if (result.error) {
                throw result.error;
            }


            currentUser =
                result.data.user;

        }


        connectionStatus.textContent =
            "Terhubung";


        const savedRoom =
            localStorage.getItem(
                "hostRoomId"
            );


        if (savedRoom) {

            await restoreHostRoom(
                savedRoom
            );

        }

    }
    catch(error) {

        console.error(error);

        connectionStatus.textContent =
            "Gagal terhubung";

        alert(
            "Gagal menghubungkan ke Supabase:\n\n" +
            error.message
        );

    }

}


await initAuth();


/* ========================================================
   NAVIGATION
======================================================== */

sendButton.onclick =
function() {

    uploadError.textContent =
        "";

    uploadStatus.textContent =
        "";

    fileInput.value =
        "";

    progress.style.width =
        "0%";

    progressContainer.classList.add(
        "ft-hidden"
    );

    showPage(
        sendPage
    );

};


receiveButton.onclick =
function() {

    codeInput.value =
        "";

    nameInput.value =
        "";

    joinError.textContent =
        "";

    showPage(
        receivePage
    );

};


backSendButton.onclick =
function() {

    showPage(
        homePage
    );

};


backReceiveButton.onclick =
function() {

    showPage(
        homePage
    );

};


/* ========================================================
   UNIQUE CODE
======================================================== */

async function createUniqueCode() {

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const code =
            generateCode();


        const {
            data,
            error
        } =
        await supabase
            .from("rooms")
            .select("id")
            .eq(
                "code",
                code
            )
            .limit(1);


        if (error) {
            throw error;
        }


        if (
            !data ||
            data.length === 0
        ) {

            return code;

        }

    }


    throw new Error(
        "Gagal membuat kode room."
    );

}


/* ========================================================
   UPLOAD
======================================================== */

uploadButton.onclick =
async function() {

    uploadError.textContent =
        "";

    uploadStatus.textContent =
        "";


    const file =
        fileInput.files[0];


    if (!file) {

        uploadError.textContent =
            "Pilih satu file terlebih dahulu.";

        return;

    }


    if (!currentUser) {

        uploadError.textContent =
            "Belum terhubung ke Supabase.";

        return;

    }


    uploadButton.disabled =
        true;


    progressContainer.classList.remove(
        "ft-hidden"
    );


    progress.style.width =
        "5%";


    let roomId =
        null;

    let filePath =
        null;


    try {

        /* ------------------------------------------------
           CREATE ROOM FIRST
        ------------------------------------------------ */

        uploadStatus.textContent =
            "Membuat room...";


        const code =
            await createUniqueCode();


        roomId =
            crypto.randomUUID();


        const cleanName =
            safeFileName(
                file.name
            );


        filePath =
            roomId +
            "/" +
            crypto.randomUUID() +
            "-" +
            cleanName;


        const expiresAt =
            new Date(
                Date.now() +
                30 * 60 * 1000
            ).toISOString();


        const {
            error: roomError
        } =
        await supabase
            .from("rooms")
            .insert({

                id:
                    roomId,

                code:
                    code,

                host_id:
                    currentUser.id,

                file_name:
                    file.name,

                file_path:
                    filePath,

                file_size:
                    file.size,

                status:
                    "waiting",

                expires_at:
                    expiresAt

            });


        if (roomError) {

            throw roomError;

        }


        progress.style.width =
            "20%";


        /* ------------------------------------------------
           UPLOAD FILE
        ------------------------------------------------ */

        uploadStatus.textContent =
            "Mengupload file...";


        const {
            error:
                uploadErrorResult
        } =
        await supabase
            .storage
            .from("files")
            .upload(
                filePath,
                file,
                {
                    upsert: false,

                    contentType:
                        file.type ||
                        "application/octet-stream"
                }
            );


        if (uploadErrorResult) {

            await supabase
                .from("rooms")
                .delete()
                .eq(
                    "id",
                    roomId
                );

            throw uploadErrorResult;

        }


        progress.style.width =
            "100%";


        uploadStatus.textContent =
            "Upload selesai.";


        /* ------------------------------------------------
           HOST STATE
        ------------------------------------------------ */

        hostRoomId =
            roomId;


        localStorage.setItem(
            "hostRoomId",
            roomId
        );


        hostCode.textContent =
            code;


        hostFile.textContent =
            file.name;


        roomExpiry.textContent =
            formatExpiry(
                expiresAt
            );


        hostStatus.textContent =
            "Menunggu penerima...";


        renderRequestList(
            []
        );


        showPage(
            hostPage
        );


        startHostPolling();

    }
    catch(error) {

        console.error(error);

        uploadError.textContent =
            error.message ||
            "Upload gagal.";

        progress.style.width =
            "0%";

    }


    uploadButton.disabled =
        false;

};


/* ========================================================
   HOST POLLING
======================================================== */

function startHostPolling() {

    stopHostPolling();

    checkHostRoom();

    hostPoll =
        setInterval(
            checkHostRoom,
            1500
        );

}


function stopHostPolling() {

    if (hostPoll) {

        clearInterval(
            hostPoll
        );

        hostPoll =
            null;

    }

}


/* ========================================================
   CHECK HOST ROOM
======================================================== */

async function checkHostRoom() {

    if (
        !hostRoomId ||
        !currentUser
    ) {

        return;

    }


    try {

        /* ------------------------------------------------
           ROOM
        ------------------------------------------------ */

        const {
            data: room,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select("*")
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            )
            .maybeSingle();


        if (roomError) {

            console.error(
                roomError
            );

            return;

        }


        if (!room) {

            stopHostPolling();

            localStorage.removeItem(
                "hostRoomId"
            );

            hostRoomId =
                null;

            requestList.innerHTML =
                "";

            requestEmpty.textContent =
                "Room sudah dihapus.";

            requestList.appendChild(
                requestEmpty
            );

            hostStatus.textContent =
                "Room sudah dihapus.";

            return;

        }


        /* ------------------------------------------------
           EXPIRED
        ------------------------------------------------ */

        if (
            room.expires_at &&
            new Date(
                room.expires_at
            ) <= new Date()
        ) {

            stopHostPolling();

            hostStatus.textContent =
                "Room sudah kedaluwarsa.";

            roomExpiry.textContent =
                "Room sudah kedaluwarsa.";

            return;

        }


        roomExpiry.textContent =
            formatExpiry(
                room.expires_at
            );


        /* ------------------------------------------------
           REQUESTS
        ------------------------------------------------ */

        const {
            data: requests,
            error: requestError
        } =
        await supabase
            .from("room_requests")
            .select(
                "id,room_id,requester_id,requester_name,status,created_at,updated_at"
            )
            .eq(
                "room_id",
                hostRoomId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (requestError) {

            console.error(
                requestError
            );

            return;

        }


        renderRequestList(
            requests || []
        );


        const pendingCount =
            (requests || [])
                .filter(
                    function(request) {

                        return (
                            request.status ===
                            "pending"
                        );

                    }
                )
                .length;


        const acceptedCount =
            (requests || [])
                .filter(
                    function(request) {

                        return (
                            request.status ===
                            "accepted"
                        );

                    }
                )
                .length;


        if (pendingCount > 0) {

            hostStatus.textContent =
                pendingCount +
                " permintaan menunggu persetujuan.";

        }
        else if (
            acceptedCount > 0
        ) {

            hostStatus.textContent =
                acceptedCount +
                " penerima sudah diterima. Menunggu permintaan lain...";

        }
        else {

            hostStatus.textContent =
                "Menunggu penerima...";

        }

    }
    catch(error) {

        console.error(error);

    }

}


/* ========================================================
   RENDER REQUEST LIST
======================================================== */

function renderRequestList(
    requests
) {

    requestList.innerHTML =
        "";


    if (
        !requests ||
        requests.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "ft-empty";

        empty.textContent =
            "Belum ada permintaan.";

        requestList.appendChild(
            empty
        );

        return;

    }


    requests.forEach(
        function(request) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "ft-request-item";


            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "ft-request-header";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "ft-request-name";

            name.textContent =
                request.requester_name ||
                "Tanpa nama";


            const status =
                document.createElement(
                    "span"
                );

            status.className =
                "ft-request-status " +
                request.status;

            status.textContent =
                request.status;


            header.appendChild(
                name
            );

            header.appendChild(
                status
            );


            item.appendChild(
                header
            );


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "ft-small";

            info.textContent =
                "Meminta akses ke file.";

            item.appendChild(
                info
            );


            /* ------------------------------------------------
               PENDING
            ------------------------------------------------ */

            if (
                request.status ===
                "pending"
            ) {

                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "ft-actions";


                const reject =
                    document.createElement(
                        "button"
                    );

                reject.className =
                    "ft-danger";

                reject.textContent =
                    "Tolak";


                const accept =
                    document.createElement(
                        "button"
                    );

                accept.className =
                    "ft-success";

                accept.textContent =
                    "Terima";


                reject.onclick =
                function() {

                    rejectRequest(
                        request.id
                    );

                };


                accept.onclick =
                function() {

                    acceptRequest(
                        request.id
                    );

                };


                actions.appendChild(
                    reject
                );

                actions.appendChild(
                    accept
                );


                item.appendChild(
                    actions
                );

            }


            /* ------------------------------------------------
               ACCEPTED
            ------------------------------------------------ */

            if (
                request.status ===
                "accepted"
            ) {

                const acceptedInfo =
                    document.createElement(
                        "div"
                    );

                acceptedInfo.className =
                    "ft-success-text";

                acceptedInfo.textContent =
                    "Penerima sudah diterima.";

                item.appendChild(
                    acceptedInfo
                );

            }


            /* ------------------------------------------------
               REJECTED
            ------------------------------------------------ */

            if (
                request.status ===
                "rejected"
            ) {

                const rejectedInfo =
                    document.createElement(
                        "div"
                    );

                rejectedInfo.className =
                    "ft-error";

                rejectedInfo.textContent =
                    "Permintaan ditolak.";

                item.appendChild(
                    rejectedInfo
                );

            }


            /* ------------------------------------------------
               CANCELLED
            ------------------------------------------------ */

            if (
                request.status ===
                "cancelled"
            ) {

                const cancelledInfo =
                    document.createElement(
                        "div"
                    );

                cancelledInfo.className =
                    "ft-small";

                cancelledInfo.textContent =
                    "Permintaan dibatalkan.";

                item.appendChild(
                    cancelledInfo
                );

            }


            requestList.appendChild(
                item
            );

        }
    );

}


/* ========================================================
   ACCEPT REQUEST
======================================================== */

async function acceptRequest(
    requestId
) {

    if (
        !hostRoomId ||
        !currentUser
    ) {

        return;

    }


    try {

        const {
            data,
            error
        } =
        await supabase
            .from("room_requests")
            .update({

                status:
                    "accepted"

            })
            .eq(
                "id",
                requestId
            )
            .eq(
                "room_id",
                hostRoomId
            )
            .select()
            .maybeSingle();


        if (error) {

            throw error;

        }


        if (!data) {

            throw new Error(
                "Request tidak ditemukan atau tidak memiliki akses."
            );

        }


        /*
         * PENTING:
         *
         * HANYA requestId ini yang
         * berubah menjadi accepted.
         *
         * Request lain tetap pending.
         */


        await checkHostRoom();

    }
    catch(error) {

        console.error(error);

        alert(
            error.message ||
            "Gagal menerima permintaan."
        );

    }

}


/* ========================================================
   REJECT REQUEST
======================================================== */

async function rejectRequest(
    requestId
) {

    if (
        !hostRoomId ||
        !currentUser
    ) {

        return;

    }


    try {

        const {
            data,
            error
        } =
        await supabase
            .from("room_requests")
            .update({

                status:
                    "rejected"

            })
            .eq(
                "id",
                requestId
            )
            .eq(
                "room_id",
                hostRoomId
            )
            .select()
            .maybeSingle();


        if (error) {

            throw error;

        }


        if (!data) {

            throw new Error(
                "Request tidak ditemukan atau tidak memiliki akses."
            );

        }


        await checkHostRoom();

    }
    catch(error) {

        console.error(error);

        alert(
            error.message ||
            "Gagal menolak permintaan."
        );

    }

}


/* ========================================================
   RESTORE HOST
======================================================== */

async function restoreHostRoom(
    roomId
) {

    if (!currentUser) {

        return;

    }


    try {

        const {
            data,
            error
        } =
        await supabase
            .from("rooms")
            .select("*")
            .eq(
                "id",
                roomId
            )
            .eq(
                "host_id",
                currentUser.id
            )
            .maybeSingle();


        if (error) {

            console.error(error);

            return;

        }


        if (!data) {

            localStorage.removeItem(
                "hostRoomId"
            );

            return;

        }


        if (
            data.expires_at &&
            new Date(
                data.expires_at
            ) <= new Date()
        ) {

            localStorage.removeItem(
                "hostRoomId"
            );

            return;

        }


        hostRoomId =
            data.id;


        hostCode.textContent =
            data.code;


        hostFile.textContent =
            data.file_name;


        roomExpiry.textContent =
            formatExpiry(
                data.expires_at
            );


        showPage(
            hostPage
        );


        startHostPolling();

    }
    catch(error) {

        console.error(error);

    }

}


/* ========================================================
   JOIN ROOM
======================================================== */

joinButton.onclick =
async function() {

    joinError.textContent =
        "";


    const code =
        codeInput.value.trim();


    const name =
        nameInput.value.trim();


    if (
        !/^\d{6}$/.test(code)
    ) {

        joinError.textContent =
            "Kode room harus 6 digit.";

        return;

    }


    if (!name) {

        joinError.textContent =
            "Masukkan nama.";

        return;

    }


    if (!currentUser) {

        joinError.textContent =
            "Belum terhubung ke Supabase.";

        return;

    }


    joinButton.disabled =
        true;


    try {

        /* ------------------------------------------------
           FIND ROOM
        ------------------------------------------------ */

        const {
            data: room,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select(
                "id,code,host_id,file_name,file_path,file_size,status,expires_at"
            )
            .eq(
                "code",
                code
            )
            .eq(
                "status",
                "waiting"
            )
            .gt(
                "expires_at",
                new Date().toISOString()
            )
            .maybeSingle();


        if (roomError) {

            throw roomError;

        }


        if (!room) {

            throw new Error(
                "Room tidak ditemukan atau sudah kedaluwarsa."
            );

        }


        if (
            room.host_id ===
            currentUser.id
        ) {

            throw new Error(
                "Tidak dapat masuk ke room sendiri."
            );

        }


        receiverRoomId =
            room.id;


        /* ------------------------------------------------
           CEK REQUEST LAMA USER
        ------------------------------------------------ */

        const {
            data: existingRequest,
            error: existingError
        } =
        await supabase
            .from("room_requests")
            .select(
                "id,status"
            )
            .eq(
                "room_id",
                room.id
            )
            .eq(
                "requester_id",
                currentUser.id
            )
            .in(
                "status",
                [
                    "pending",
                    "accepted"
                ]
            )
            .maybeSingle();


        if (existingError) {

            throw existingError;

        }


        if (existingRequest) {

            receiverRequestId =
                existingRequest.id;


            if (
                existingRequest.status ===
                "accepted"
            ) {

                waitingCode.textContent =
                    room.code;

                waitingStatus.textContent =
                    "Kamu sudah diterima host.";

                downloadCode.textContent =
                    room.code;

                downloadFile.textContent =
                    room.file_name;

                downloadStatus.textContent =
                    "File siap diunduh.";

                showPage(
                    downloadPage
                );

                startReceiverPolling();

                return;

            }


            throw new Error(
                "Kamu sudah memiliki permintaan yang sedang menunggu."
            );

        }


        /* ------------------------------------------------
           CREATE REQUEST
        ------------------------------------------------ */

        const {
            data: request,
            error: requestError
        } =
        await supabase
            .from("room_requests")
            .insert({

                room_id:
                    room.id,

                requester_id:
                    currentUser.id,

                requester_name:
                    name,

                status:
                    "pending"

            })
            .select()
            .single();


        if (requestError) {

            throw requestError;

        }


        receiverRequestId =
            request.id;


        waitingCode.textContent =
            room.code;


        waitingStatus.textContent =
            "Menunggu host menerima...";


        showPage(
            waitingPage
        );


        startReceiverPolling();

    }
    catch(error) {

        console.error(error);

        joinError.textContent =
            error.message ||
            "Gagal mengirim permintaan.";

    }


    joinButton.disabled =
        false;

};


/* ========================================================
   RECEIVER POLLING
======================================================== */

function startReceiverPolling() {

    stopReceiverPolling();

    checkReceiverRequest();

    receiverPoll =
        setInterval(
            checkReceiverRequest,
            1500
        );

}


function stopReceiverPolling() {

    if (receiverPoll) {

        clearInterval(
            receiverPoll
        );

        receiverPoll =
            null;

    }

}


/* ========================================================
   CHECK RECEIVER REQUEST
======================================================== */

async function checkReceiverRequest() {

    if (
        !receiverRequestId ||
        !currentUser
    ) {

        return;

    }


    try {

        const {
            data: request,
            error
        } =
        await supabase
            .from("room_requests")
            .select(
                "id,room_id,requester_id,requester_name,status"
            )
            .eq(
                "id",
                receiverRequestId
            )
            .eq(
                "requester_id",
                currentUser.id
            )
            .maybeSingle();


        if (error) {

            console.error(error);

            return;

        }


        if (!request) {

            stopReceiverPolling();

            waitingStatus.textContent =
                "Permintaan tidak ditemukan.";

            return;

        }


        if (
            request.status ===
            "pending"
        ) {

            waitingStatus.textContent =
                "Menunggu host menerima...";

            return;

        }


        if (
            request.status ===
            "rejected"
        ) {

            stopReceiverPolling();

            waitingStatus.textContent =
                "Permintaan ditolak host.";

            return;

        }


        if (
            request.status ===
            "cancelled"
        ) {

            stopReceiverPolling();

            waitingStatus.textContent =
                "Permintaan dibatalkan.";

            return;

        }


        if (
            request.status ===
            "accepted"
        ) {

            stopReceiverPolling();


            /* ------------------------------------------------
               AMBIL ROOM
            ------------------------------------------------ */

            const {
                data: room,
                error: roomError
            } =
            await supabase
                .from("rooms")
                .select(
                    "id,code,file_name,file_path,status,expires_at"
                )
                .eq(
                    "id",
                    request.room_id
                )
                .maybeSingle();


            if (roomError) {

                console.error(
                    roomError
                );

                waitingStatus.textContent =
                    roomError.message;

                return;

            }


            if (!room) {

                waitingStatus.textContent =
                    "Room sudah tidak tersedia.";

                return;

            }


            if (
                room.expires_at &&
                new Date(
                    room.expires_at
                ) <= new Date()
            ) {

                waitingStatus.textContent =
                    "Room sudah kedaluwarsa.";

                return;

            }


            downloadCode.textContent =
                room.code;


            downloadFile.textContent =
                room.file_name;


            downloadStatus.textContent =
                "Host sudah menerima permintaan kamu.";


            showPage(
                downloadPage
            );

        }

    }
    catch(error) {

        console.error(error);

    }

}


/* ========================================================
   CANCEL REQUEST
======================================================== */

cancelRequestButton.onclick =
async function() {

    if (
        !receiverRequestId ||
        !currentUser
    ) {

        showPage(
            homePage
        );

        return;

    }


    cancelRequestButton.disabled =
        true;


    try {

        const {
            error
        } =
        await supabase
            .from("room_requests")
            .update({

                status:
                    "cancelled"

            })
            .eq(
                "id",
                receiverRequestId
            )
            .eq(
                "requester_id",
                currentUser.id
            )
            .eq(
                "status",
                "pending"
            );


        if (error) {

            throw error;

        }


        stopReceiverPolling();


        receiverRequestId =
            null;

        receiverRoomId =
            null;


        showPage(
            homePage
        );

    }
    catch(error) {

        console.error(error);

        alert(
            error.message ||
            "Gagal membatalkan permintaan."
        );

    }


    cancelRequestButton.disabled =
        false;

};


/* ========================================================
   DOWNLOAD
======================================================== */

downloadButton.onclick =
async function() {

    if (
        !receiverRoomId ||
        !receiverRequestId ||
        !currentUser
    ) {

        downloadStatus.textContent =
            "Informasi request tidak ditemukan.";

        return;

    }


    downloadButton.disabled =
        true;


    downloadStatus.textContent =
        "Memeriksa akses...";


    try {

        /* ------------------------------------------------
           PASTIKAN REQUEST INI ACCEPTED
        ------------------------------------------------ */

        const {
            data: request,
            error: requestError
        } =
        await supabase
            .from("room_requests")
            .select(
                "id,room_id,requester_id,status"
            )
            .eq(
                "id",
                receiverRequestId
            )
            .eq(
                "room_id",
                receiverRoomId
            )
            .eq(
                "requester_id",
                currentUser.id
            )
            .eq(
                "status",
                "accepted"
            )
            .maybeSingle();


        if (requestError) {

            throw requestError;

        }


        if (!request) {

            throw new Error(
                "Permintaan kamu belum diterima host."
            );

        }


        /* ------------------------------------------------
           AMBIL ROOM
        ------------------------------------------------ */

        const {
            data: room,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select(
                "id,file_name,file_path,expires_at"
            )
            .eq(
                "id",
                receiverRoomId
            )
            .maybeSingle();


        if (roomError) {

            throw roomError;

        }


        if (!room) {

            throw new Error(
                "Room tidak ditemukan."
            );

        }


        if (
            room.expires_at &&
            new Date(
                room.expires_at
            ) <= new Date()
        ) {

            throw new Error(
                "Room sudah kedaluwarsa."
            );

        }


        /* ------------------------------------------------
           DOWNLOAD STORAGE
        ------------------------------------------------ */

        downloadStatus.textContent =
            "Menyiapkan download...";


        const {
            data: fileData,
            error: fileError
        } =
        await supabase
            .storage
            .from("files")
            .download(
                room.file_path
            );


        if (fileError) {

            throw fileError;

        }


        const url =
            URL.createObjectURL(
                fileData
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            room.file_name ||
            "download";


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        downloadStatus.textContent =
            "Download dimulai.";

    }
    catch(error) {

        console.error(error);

        downloadStatus.textContent =
            error.message ||
            "Download gagal.";

    }


    downloadButton.disabled =
        false;

};


/* ========================================================
   DELETE ROOM
======================================================== */

deleteRoomButton.onclick =
async function() {

    if (
        !hostRoomId ||
        !currentUser
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Hapus room dan file ini?"
        );


    if (!confirmed) {

        return;

    }


    deleteRoomButton.disabled =
        true;


    try {

        /* ------------------------------------------------
           AMBIL FILE PATH
        ------------------------------------------------ */

        const {
            data: room,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select(
                "file_path"
            )
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            )
            .maybeSingle();


        if (roomError) {

            throw roomError;

        }


        if (!room) {

            throw new Error(
                "Room tidak ditemukan."
            );

        }


        /* ------------------------------------------------
           DELETE STORAGE
        ------------------------------------------------ */

        if (
            room.file_path
        ) {

            const {
                error:
                    storageError
            } =
            await supabase
                .storage
                .from("files")
                .remove([
                    room.file_path
                ]);


            if (storageError) {

                throw storageError;

            }

        }


        /* ------------------------------------------------
           DELETE ROOM
           room_requests ikut terhapus
           karena ON DELETE CASCADE.
        ------------------------------------------------ */

        const {
            error:
                deleteError
        } =
        await supabase
            .from("rooms")
            .delete()
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            );


        if (deleteError) {

            throw deleteError;

        }


        stopHostPolling();


        localStorage.removeItem(
            "hostRoomId"
        );


        hostRoomId =
            null;


        requestList.innerHTML =
            "";


        showPage(
            homePage
        );

    }
    catch(error) {

        console.error(error);

        alert(
            error.message ||
            "Gagal menghapus room."
        );

    }


    deleteRoomButton.disabled =
        false;

};


/* ========================================================
   CLEANUP POLLING
======================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        stopHostPolling();

        stopReceiverPolling();

    }
);

</script>
