<!DOCTYPE html>
<html lang="id">
<head>

<title>File Transfer</title>

<link rel="stylesheet" href="template.css">

<style>

html,
body {
    max-width: 100%;
    overflow-x: hidden;
}

h2 {
    font-size: 2em;
    text-align: center;
    margin: 8px;
}

.ft-page {
    width: 95%;
    max-width: 720px;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 62px 12px 24px;
    color: var(--text);
}

.ft-page *,
.ft-page *::before,
.ft-page *::after {
    box-sizing: border-box;
}

.ft-page h1 {
    color: var(--accent);
    font-family: minecraft, Arial, sans-serif;
    text-align: center;
    font-size: 2.2em;
    margin: 0 0 20px;
    text-shadow:
        0 1px 0 rgba(255,255,255,.4),
        0 4px 0 var(--daccent);
    letter-spacing: 1px;
}

.ft-page .ft-page-view {
    display: none;
}

.ft-page .ft-page-view.active {
    display: block;
}

.ft-page .ft-card {
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
}

.ft-page .ft-center {
    text-align: center;
}

.ft-page .ft-small {
    font-size: 14px;
    color: var(--text2);
}

.ft-page label {
    font-weight: bold;
}

.ft-page input[type="file"] {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 8px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    background: var(--sp);
    color: var(--text);
    outline: none;
}

.ft-page input[type="file"]::file-selector-button {
    background: var(--accent);
    border: none;
    border-radius: 4px;
    padding: 7px 10px;
    font-weight: bold;
    color: white;
    margin-right: 10px;
    cursor: pointer;
}

.ft-page input[type="text"] {
    width: 100%;
    min-height: 45px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 10px;
    background: var(--sp);
    color: var(--text);
    outline: none;
    font-size: 16px;
}

.ft-page input[type="text"]:focus {
    border-color: var(--accent);
}

.ft-page input::placeholder {
    color: var(--ph);
}

.ft-page .ft-code {
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 6px;
    margin: 18px 0;
    color: var(--accent);
}

.ft-page .ft-file {
    background: var(--sp);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    word-break: break-word;
}

.ft-page .ft-status {
    text-align: center;
    color: var(--text2);
    margin-top: 15px;
}

.ft-page .ft-error {
    color: #e53935;
    margin-top: 10px;
}

.ft-page .ft-info {
    text-align: center;
    padding: 10px;
    color: var(--text2);
}

.ft-page .ft-request {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}

.ft-page .ft-request-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

.ft-page .ft-request-time {
    font-size: 13px;
    color: var(--text2);
    margin-top: 5px;
}

.ft-page .ft-actions {
    display: flex;
    gap: 10px;
}

.ft-page .ft-actions button {
    flex: 1;
}

.ft-page .ft-progress-container {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.ft-page .ft-progress {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .2s ease;
}

.ft-page .ft-hidden {
    display: none !important;
}

.ft-page button {
    width: 100%;
    min-height: 45px;
    border-radius: 8px;
    font-size: 16px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    margin-top: 10px;
    padding: 10px 14px;
    font-weight: bold;
    transition: opacity .2s ease, transform .1s ease;
}

.ft-page button:hover {
    opacity: .9;
}

.ft-page button:active {
    transform: translateY(1px);
}

.ft-page button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.ft-page button.ft-success {
    background: #2e7d32;
}

.ft-page button.ft-danger {
    background: #d32f2f;
}

.ft-page button.ft-secondary {
    background: var(--ph);
    color: #fff;
}

.ft-page .ft-request + .ft-request {
    margin-top: 12px;
}

.ft-page .ft-empty-request {
    text-align: center;
    color: var(--text2);
    padding: 10px;
}

.ft-page .ft-expire {
    margin-top: 10px;
    font-size: 14px;
    color: var(--text2);
}

@media (max-width: 600px) {

    .ft-page {
        padding: 58px 10px 20px;
    }

    .ft-page h1 {
        font-size: 1.9em;
    }

    .ft-page .ft-card {
        padding: 15px;
    }

    .ft-page .ft-code {
        font-size: 30px;
    }

    .ft-page .ft-actions {
        flex-direction: column;
        gap: 0;
    }

}

<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
========================================================
SUPABASE
========================================================
*/

const SUPABASE_URL =
    "https://juuoofdtpsbvgjfwtuvy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_guhUiQKd6KYCab6J94B2_A_1GT9P7rg";

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
========================================================
GLOBAL
========================================================
*/

let currentUser = null;

let hostRoomId = null;

let receiverRoomId = null;

let receiverRequestId = null;

let hostPoll = null;

let receiverPoll = null;


/*
========================================================
ELEMENT
========================================================
*/

const pages =
    document.querySelectorAll(
        ".ft-page-view"
    );

const homePage =
    document.getElementById(
        "homePage"
    );

const sendPage =
    document.getElementById(

    );

const hostPage =
    document.getElementById(
        "hostPage"
    );

const receivePage =
    document.getElementById(
        "receivePage"
    );

const waitingPage =
    document.getElementById(
        "waitingPage"
    );

const downloadPage =
    document.getElementById(
        "downloadPage"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );

const receiveButton =
    document.getElementById(
        "receiveButton"
    );

const backSendButton =
    document.getElementById(
        "backSendButton"
    );

const backReceiveButton =
    document.getElementById(
        "backReceiveButton"
    );


const fileInput =
    document.getElementById(
        "fileInput"
    );

const uploadButton =
    document.getElementById(
        "uploadButton"
    );

const uploadStatus =
    document.getElementById(
        "uploadStatus"
    );

const uploadError =
    document.getElementById(
        "uploadError"
    );

const progressContainer =
    document.getElementById(
        "progressContainer"
    );

const progress =
    document.getElementById(
        "progress"
    );


const hostCode =
    document.getElementById(
        "hostCode"
    );

const hostFile =
    document.getElementById(
        "hostFile"
    );

const hostStatus =
    document.getElementById(
        "hostStatus"
    );

const hostExpire =
    document.getElementById(
        "hostExpire"
    );


const requestCard =
    document.getElementById(
        "requestCard"
    );

const requestList =
    document.getElementById(
        "requestList"
    );


const acceptedCard =
    document.getElementById(
        "acceptedCard"
    );

const acceptedName =
    document.getElementById(
        "acceptedName"
    );


const deleteRoomButton =
    document.getElementById(
        "deleteRoomButton"
    );


const codeInput =
    document.getElementById(
        "codeInput"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const joinError =
    document.getElementById(

    );


const waitingCode =

    );

const waitingStatus =

        "waitingStatus"
    );

    );

const downloadButton =

        "downloadButton"
    );

const downloadStatus =
    document.getElementById(
        "downloadStatus"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


/*
========================================================
SHOW PAGE
========================================================
*/

function showPage(page) {

    pages.forEach(function(item) {

        item.classList.remove(
            "active"
        );

    });

    page.classList.add(
        "active"
    );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
========================================================
GENERATE CODE
========================================================
*/

function generateCode() {

    return Math.floor(
        100000 +
        Math.random() * 900000
    ).toString();

}


/*
========================================================
SAFE FILE NAME
========================================================
*/

function safeFileName(name) {

    return name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );

}


/*
========================================================
AUTH
========================================================
*/

async function initAuth() {

    try {

        const {
            data,
            error
        } =
        await supabase.auth.getSession();


        if (error) {

            throw error;

        }


        if (
            data &&
            data.session &&
            data.session.user
        ) {

            currentUser =
                data.session.user;

        }
        else {

            const result =
                await supabase.auth
                    .signInAnonymously();


            if (result.error) {

                throw result.error;

            }


            currentUser =
                result.data.user;

        }


        connectionStatus.textContent =
            "Terhubung";


        const savedRoom =
            localStorage.getItem(
                "hostRoomId"
            );


        if (savedRoom) {

            await restoreHostRoom(
                savedRoom
            );

        }

    }
    catch(error) {

        console.error(error);

        connectionStatus.textContent =
            "Gagal terhubung";

        alert(
            "Gagal menghubungkan ke Supabase:\n\n" +
            error.message
        );

    }

}


await initAuth();


/*
========================================================
NAVIGASI
========================================================
*/

sendButton.onclick =
function() {

    uploadError.textContent = "";

    uploadStatus.textContent = "";

    fileInput.value = "";

    progress.style.width =
        "0%";

    progressContainer.classList.add(
        "ft-hidden"
    );

    showPage(sendPage);

};


receiveButton.onclick =
function() {

    codeInput.value = "";

    nameInput.value = "";

    joinError.textContent = "";

    showPage(receivePage);

};


backSendButton.onclick =
function() {

    showPage(homePage);

};


backReceiveButton.onclick =
function() {

    showPage(homePage);

};


/*
========================================================
CREATE UNIQUE CODE
========================================================
*/

async function createUniqueCode() {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const code =
            generateCode();


        const {
            data,
            error
        } =
        await supabase
            .from("rooms")
            .select("id")
            .eq(
                "code",
                code
            )
            .limit(1);


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            return code;

        }

    }


    throw new Error(
        "Gagal membuat kode room."
    );

}


/*
========================================================
UPLOAD
========================================================
*/

uploadButton.onclick =
async function() {

    uploadError.textContent = "";

    uploadStatus.textContent = "";


    const file =
        fileInput.files[0];


    if (!file) {

        uploadError.textContent =
            "Pilih satu file terlebih dahulu.";

        return;

    }


    if (!currentUser) {

        uploadError.textContent =
            "Belum terhubung ke Supabase.";

        return;

    }


    uploadButton.disabled =
        true;


    progressContainer.classList.remove(
        "ft-hidden"
    );


    progress.style.width =
        "10%";


    try {

        uploadStatus.textContent =
            "Membuat room...";


        const code =
            await createUniqueCode();


        const roomId =
            crypto.randomUUID();


        const cleanName =
            safeFileName(
                file.name
            );


        const filePath =
            roomId +
            "/" +
            crypto.randomUUID() +
            "-" +
            cleanName;


        uploadStatus.textContent =
            "Mengupload file...";


        progress.style.width =
            "30%";


        const {
            error:
                storageError
        } =
        await supabase
            .storage
            .from("files")
            .upload(
                filePath,
                file,
                {
                    upsert: false,

                    contentType:
                        file.type ||
                        "application/octet-stream"
                }
            );


        if (storageError) {

            throw storageError;

        }


        progress.style.width =
            "75%";


        uploadStatus.textContent =
            "Menyimpan room...";


        const expiresAt =
            new Date(
                Date.now() +
                30 * 60 * 1000
            ).toISOString();


        const {
            error:
                roomError
        } =
        await supabase
            .from("rooms")
            .insert({

                id:
                    roomId,

                code:
                    code,

                host_id:
                    currentUser.id,

                file_name:
                    file.name,

                file_path:
                    filePath,

                file_size:
                    file.size,

                status:
                    "waiting",

                expires_at:
                    expiresAt

            });


        if (roomError) {

            await supabase
                .storage
                .from("files")
                .remove([
                    filePath
                ]);

            throw roomError;

        }


        progress.style.width =
            "100%";


        uploadStatus.textContent =
            "Upload selesai.";


        hostRoomId =
            roomId;


        localStorage.setItem(
            "hostRoomId",
            roomId
        );


        hostCode.textContent =
            code;

        hostFile.textContent =
            file.name;

        hostStatus.textContent =
            "Menunggu penerima...";


        hostExpire.textContent =
            "Room berlaku selama 30 menit.";


        requestCard.classList.add(
            "ft-hidden"
        );


        acceptedCard.classList.add(
            "ft-hidden"
        );


        showPage(hostPage);


        startHostPolling();

    }
    catch(error) {

        console.error(error);

        uploadError.textContent =
            error.message ||
            "Upload gagal.";

    }


    uploadButton.disabled =
        false;

};


/*
========================================================
HOST POLLING
========================================================
*/

function startHostPolling() {

    stopHostPolling();

    checkHostRoom();

    hostPoll =
        setInterval(
            checkHostRoom,
            1500
        );

}


function stopHostPolling() {

    if (hostPoll) {

        clearInterval(
            hostPoll
        );

        hostPoll = null;

    }

}


/*
========================================================
CHECK HOST ROOM
========================================================
*/

async function checkHostRoom() {

    if (
        !hostRoomId ||
        !currentUser
    ) {

        return;

    }


    try {

        const {
            data: room,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select("*")
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            )
            .maybeSingle();


        if (roomError) {

            console.error(
                roomError
            );

            return;

        }


        if (!room) {

            stopHostPolling();

            localStorage.removeItem(
                "hostRoomId"
            );

            hostRoomId = null;

            requestCard.classList.add(
                "ft-hidden"
            );

            acceptedCard.classList.add(
                "ft-hidden"
            );

            hostStatus.textContent =
                "Room sudah tidak tersedia.";

            return;

        }


        /*
        --------------------------------------------
        Cek expired
        --------------------------------------------
        */

        if (
            room.expires_at &&
            new Date(
                room.expires_at
            ) <= new Date()
        ) {

            hostStatus.textContent =
                "Room sudah kedaluwarsa.";

            return;

        }


        /*
        --------------------------------------------
        Ambil semua request
        --------------------------------------------
        */

        const {
            data: requests,
            error:
                requestError
        } =
        await supabase
            .from("room_requests")
            .select("*")
            .eq(
                "room_id",
                hostRoomId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (requestError) {

            console.error(
                requestError
            );

            return;

        }


        renderHostRequests(
            requests || []
        );


        /*
        --------------------------------------------
        Cari accepted
        --------------------------------------------
        */

        const accepted =
            (requests || []).find(
                function(request) {

                    return (
                        request.status ===
                        "accepted"
                    );

                }
            );


        if (accepted) {

            acceptedCard.classList.remove(
                "ft-hidden"
            );


            acceptedName.textContent =
                accepted.requester_name ||
                "Penerima";


            hostStatus.textContent =
                "Penerima sudah diterima.";

        }
        else {

            acceptedCard.classList.add(
                "ft-hidden"
            );


            const pending =
                (requests || []).filter(
                    function(request) {

                        return (
                            request.status ===
                            "pending"
                        );

                    }
                );


            if (pending.length > 0) {

                hostStatus.textContent =
                    pending.length +
                    " permintaan menunggu.";

            }
            else {

                hostStatus.textContent =
                    "Menunggu penerima...";

            }

        }


        /*
        --------------------------------------------
        Countdown
        --------------------------------------------
        */

        updateExpireText(
            room.expires_at
        );

    }
    catch(error) {

        console.error(error);

    }

}


/*
========================================================
RENDER REQUEST LIST
========================================================
*/

function renderHostRequests(
    requests
) {

    const pendingRequests =
        requests.filter(
            function(request) {

                return (
                    request.status ===
                    "pending"
                );

            }
        );


    if (
        pendingRequests.length === 0
    ) {

        requestCard.classList.add(
            "ft-hidden"
        );

        requestList.innerHTML =
            "";

        return;

    }


    requestCard.classList.remove(
        "ft-hidden"
    );


    requestList.innerHTML =
        "";


    pendingRequests.forEach(
        function(request) {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "ft-request";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "ft-request-name";


            name.textContent =
                request.requester_name ||
                "Tanpa nama";


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "ft-small";


            text.textContent =
                "ingin menerima file.";


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "ft-actions";


            const reject =
                document.createElement(
                    "button"
                );


            reject.className =
                "ft-danger";


            reject.textContent =
                "Tolak";


            const accept =
                document.createElement(
                    "button"
                );


            accept.className =
                "ft-success";


            accept.textContent =
                "Terima";


            reject.onclick =
                function() {

                    rejectRequest(
                        request.id
                    );

                };


            accept.onclick =
                function() {

                    acceptRequest(
                        request.id
                    );

                };


            actions.appendChild(
                reject
            );

            actions.appendChild(
                accept
            );


            wrapper.appendChild(
                name
            );

            wrapper.appendChild(
                text
            );

            wrapper.appendChild(
                actions
            );


            requestList.appendChild(
                wrapper
            );

        }
    );

}


/*
========================================================
ACCEPT REQUEST
========================================================
*/

async function acceptRequest(
    requestId
) {

    if (
        !hostRoomId ||
        !currentUser
    ) {

        return;

    }


    if (
        !confirm(
            "Terima permintaan ini?"
        )
    ) {

        return;

    }


    try {

        /*
        --------------------------------------------
        Pastikan request masih pending
        --------------------------------------------
        */

        const {
            data: request,
            error:
                requestError
        } =
        await supabase
            .from("room_requests")
            .select("*")
            .eq(
                "id",
                requestId
            )
            .eq(
                "room_id",
                hostRoomId
            )
            .eq(
                "status",
                "pending"
            )
            .maybeSingle();


        if (requestError) {

            throw requestError;

        }


        if (!request) {

            throw new Error(
                "Permintaan sudah tidak tersedia."
            );

        }


        /*
        --------------------------------------------
        Accept request yang dipilih
        --------------------------------------------
        */

        const {
            error:
                acceptError
        } =
        await supabase
            .from("room_requests")
            .update({
                status:
                    "accepted"
            })
            .eq(
                "id",
                requestId
            )
            .eq(
                "room_id",
                hostRoomId
            )
            .eq(
                "status",
                "pending"
            );


        if (acceptError) {

            throw acceptError;

        }


        /*
        --------------------------------------------
        Tolak semua request lain
        --------------------------------------------
        */

        const {
            error:
                rejectOthersError
        } =
        await supabase
            .from("room_requests")
            .update({
                status:
                    "rejected"
            })
            .eq(
                "room_id",
                hostRoomId
            )
            .eq(
                "status",
                "pending"
            )
            .neq(
                "id",
                requestId
            );


        if (rejectOthersError) {

            throw rejectOthersError;

        }


        /*
        --------------------------------------------
        Update room
        --------------------------------------------
        */

        const {
            error:
                roomError
        } =
        await supabase
            .from("rooms")
            .update({
                status:
                    "accepted"
            })
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            );


        if (roomError) {

            throw roomError;

        }


        acceptedName.textContent =
            request.requester_name ||
            "Penerima";


        acceptedCard.classList.remove(
            "ft-hidden"
        );


        hostStatus.textContent =
            "Penerima sudah diterima.";


        await checkHostRoom();

    }
    catch(error) {

        console.error(error);

        alert(
            error.message ||
            "Gagal menerima permintaan."
        );

    }

}


/*
========================================================
REJECT REQUEST
========================================================
*/

async function rejectRequest(

/*
========================================================
RESTORE HOST
========================================================
*/

async function restoreHostRoom(
    roomId
) {

    if (!currentUser) {

        return;

    }


    try {

        const {
            data,
            error
        } =
        await supabase
            .from("rooms")
            .select("*")
            .eq(
                "id",
                roomId
            )
            .eq(
                "host_id",
                currentUser.id
            )
            .maybeSingle();


        if (error) {

            console.error(error);

            return;

        }


        if (!data) {

            localStorage.removeItem(
                "hostRoomId"
            );

            return;

        }


        hostRoomId =
            data.id;


        hostCode.textContent =
            data.code;


        hostFile.textContent =
            data.file_name;


        hostExpire.textContent =
            "Room berlaku selama 30 menit.";


        showPage(
            hostPage
        );


        startHostPolling();

    }
    catch(error) {

        console.error(error);

    }

}


/*
========================================================
EXPIRE TEXT
========================================================
*/

function updateExpireText(
    expiresAt
) {

    if (!expiresAt) {

        hostExpire.textContent =
            "";

        return;

    }


    const expire =
        new Date(
            expiresAt
        );


    const now =
        new Date();


    const difference =
        expire.getTime() -
        now.getTime();


    if (difference <= 0) {

        hostExpire.textContent =
            "Room sudah kedaluwarsa.";

        return;

    }


    const minutes =
        Math.floor(
            difference /
            60000
        );


    const seconds =
        Math.floor(
            (difference %
                60000) /
            1000
        );


    hostExpire.textContent =
        "Berakhir dalam " +
        minutes +
        " menit " +
        seconds +
        " detik.";

}


/*
========================================================
JOIN ROOM
========================================================
*/

joinButton.onclick =
async function() {

    joinError.textContent =
        "";


    const code =
        codeInput.value.trim();


    const name =
        nameInput.value.trim();


    if (
        !/^\d{6}$/.test(code)
    ) {

        joinError.textContent =
            "Kode room harus 6 digit.";

        return;

    }


    if (!name) {

        joinError.textContent =
            "Masukkan nama.";

        return;

    }


    if (!currentUser) {

        joinError.textContent =
            "Belum terhubung ke Supabase.";

        return;

    }


    joinButton.disabled =
        true;


    try {

        /*
        --------------------------------------------
        Cari room
        --------------------------------------------
        */

        const {
            data: room,
            error: roomError
        } =
        await supabase
            .from("rooms")
            .select("*")
            .eq(
                "code",
                code
            )
            .eq(
                "status",
                "waiting"
            )
            .maybeSingle();


        if (roomError) {

            throw roomError;

        }


        if (!room) {

            throw new Error(
                "Room tidak ditemukan atau sudah tidak tersedia."
            );

        }


        /*
        --------------------------------------------
        Cek expired
        --------------------------------------------
        */

        if (
            room.expires_at &&
            new Date(
                room.expires_at
            ) <= new Date()
        ) {

            throw new Error(
                "Room sudah kedaluwarsa."
            );

        }


        /*
        --------------------------------------------
        Jangan masuk room sendiri
        --------------------------------------------
        */

        if (
            room.host_id ===
            currentUser.id
        ) {

            throw new Error(
                "Tidak dapat masuk ke room sendiri."
            );

        }


        /*
        --------------------------------------------
        Cek apakah user sudah request
        --------------------------------------------
        */

        const {
            data: existingRequest,
            error:
                existingError
        } =
        await supabase
            .from("room_requests")
            .select("*")
            .eq(
                "room_id",
                room.id
            )
            .eq(
                "requester_id",
                currentUser.id
            )
            .maybeSingle();


        if (existingError) {

            throw existingError;

        }


        /*
        --------------------------------------------
        Jika sudah accepted
        --------------------------------------------
        */

        if (
            existingRequest &&
            existingRequest.status ===
            "accepted"
        ) {

            receiverRoomId =
                room.id;

            receiverRequestId =
                existingRequest.id;

            downloadCode.textContent =
                room.code;

            downloadFile.textContent =
                room.file_name;

            downloadStatus.textContent =
                "File siap diunduh.";

            showPage(
                downloadPage
            );

            return;

        }


        /*
        --------------------------------------------
        Jika sudah pending
        --------------------------------------------
        */

        if (
            existingRequest &&
            existingRequest.status ===
            "pending"
        ) {

            receiverRoomId =
                room.id;

            receiverRequestId =
                existingRequest.id;

            waitingCode.textContent =
                room.code;

            waitingStatus.textContent =
                "Menunggu host menerima...";

            showPage(
                waitingPage
            );

            startReceiverPolling();

            return;

        }


        /*
        --------------------------------------------
        Jika request lama rejected
        --------------------------------------------
        */

        if (
            existingRequest &&
            existingRequest.status ===
            "rejected"
        ) {

            const {
                data: updatedRequest,
                error:
                    updateError
            } =
            await supabase
                .from("room_requests")
                .update({

                    requester_name:
                        name,

                    status:
                        "pending",

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    existingRequest.id
                )
                .select()
                .single();


            if (updateError) {

                throw updateError;

            }


            receiverRoomId =
                room.id;

            receiverRequestId =
                updatedRequest.id;

        }
        else {

            /*
            ----------------------------------------
            Request baru
            ----------------------------------------
            */

            const {
                data: newRequest,
                error:
                    insertError
            } =
            await supabase
                .from("room_requests")
                .insert({

                    room_id:
                        room.id,

                    requester_id:
                        currentUser.id,

                    requester_name:
                        name,

                    status:
                        "pending"

                })
                .select()
                .single();


            if (insertError) {

                throw insertError;

            }


            receiverRoomId =
                room.id;

            receiverRequestId =
                newRequest.id;

        }


        waitingCode.textContent =
            room.code;


        waitingStatus.textContent =
            "Menunggu host menerima...";


        showPage(
            waitingPage
        );


        startReceiverPolling();

    }
    catch(error) {

        console.error(error);

        joinError.textContent =
            error.message ||
            "Gagal mengirim permintaan.";

    }


    joinButton.disabled =
        false;

};


/*
========================================================
RECEIVER POLLING
========================================================
*/

function startReceiverPolling() {

    stopReceiverPolling();

    checkReceiverRoom();

    receiverPoll =
        setInterval(
            checkReceiverRoom,
            1500
        );

}


function stopReceiverPolling() {

    if (receiverPoll) {

        clearInterval(
            receiverPoll
        );

        receiverPoll = null;

    }

}


/*
========================================================
CHECK RECEIVER
========================================================
*/

async function checkReceiverRoom() {

    if (
        !receiverRoomId ||
        !receiverRequestId ||
        !currentUser
    ) {

        return;

    }


    try {

        /*
        --------------------------------------------
        Ambil request MILIK USER INI
        --------------------------------------------
        */

        const {
            data: request,
            error:
                requestError
        } =
        await supabase
            .from("room_requests")
            .select("*")
            .eq(
                "id",
                receiverRequestId
            )
            .eq(
                "requester_id",
                currentUser.id
            )
            .maybeSingle();


        if (requestError) {

            console.error(
                requestError
            );

            return;

        }


        if (!request) {

            stopReceiverPolling();

            waitingStatus.textContent =
                "Permintaan sudah tidak tersedia.";

            return;

        }


        /*
        --------------------------------------------
        DITERIMA
        --------------------------------------------
        */

        if (
            request.status ===
            "accepted"
        ) {

            /*
            Pastikan room masih ada
            */

            const {
                data: room,
                error:
                    roomError
            } =
            await supabase
                .from("rooms")
                .select("*")
                .eq(
                    "id",
                    receiverRoomId
                )
                .maybeSingle();


            if (roomError) {

                console.error(
                    roomError
                );

                return;

            }


            if (!room) {

                stopReceiverPolling();

                waitingStatus.textContent =
                    "Room sudah dihapus.";

                return;

            }


            stopReceiverPolling();


            downloadCode.textContent =
                room.code;


            downloadFile.textContent =
                room.file_name;


            downloadStatus.textContent =
                "Kamu sudah diterima host.";


            showPage(
                downloadPage
            );


            return;

        }


        /*
        --------------------------------------------
        DITOLAK
        --------------------------------------------
        */

        if (
            request.status ===
            "rejected"
        ) {

            stopReceiverPolling();

            waitingStatus.textContent =
                "Permintaan ditolak host.";

            return;

        }


        waitingStatus.textContent =
            "Menunggu host menerima...";

    }
    catch(error) {

        console.error(error);

    }

}


/*
========================================================
CANCEL REQUEST
========================================================
*/

cancelRequestButton.onclick =
async function() {

    if (
        !receiverRequestId ||
        !currentUser
    ) {

        showPage(
            homePage
        );

        return;

    }


    cancelRequestButton.disabled =
        true;


    try {

        const {
            error
        } =
        await supabase
            .from("room_requests")
            .delete()
            .eq(
                "id",
                receiverRequestId
            )
            .eq(
                "requester_id",
                currentUser.id
            );


        if (error) {

            throw error;

        }


        stopReceiverPolling();


        receiverRoomId =
            null;


        receiverRequestId =
            null;


        showPage(
            homePage
        );

    }
    catch(error) {

        console.error(error);

        alert(
            error.message ||
            "Gagal membatalkan permintaan."
        );

    }


    cancelRequestButton.disabled =
        false;

};


/*
========================================================
DOWNLOAD
========================================================
*/

downloadButton.onclick =
async function() {

    if (
        !receiverRoomId ||
        !receiverRequestId ||
        !currentUser
    ) {

        downloadStatus.textContent =
            "Data room tidak ditemukan.";

        return;

    }


    downloadButton.disabled =
        true;


    downloadStatus.textContent =
        "Menyiapkan download...";


    try {

        /*
        --------------------------------------------
        Pastikan request user ACCEPTED
        --------------------------------------------
        */

        const {
            data: request,
            error:
                requestError
        } =
        await supabase
            .from("room_requests")
            .select("status,room_id,requester_id")
            .eq(
                "id",
                receiverRequestId
            )
            .eq(
                "room_id",
                receiverRoomId
            )
            .eq(
                "requester_id",
                currentUser.id
            )
            .maybeSingle();


        if (requestError) {

            throw requestError;

        }


        if (!request) {

            throw new Error(
                "Permintaan tidak ditemukan."
            );

        }


        if (
            request.status !==
            "accepted"
        ) {

            throw new Error(
                "Kamu belum diterima host."
            );

        }


        /*
        --------------------------------------------
        Ambil room
        --------------------------------------------
        */

        const {
            data: room,
            error:
                roomError
        } =
        await supabase
            .from("rooms")
            .select(
                "id,code,file_name,file_path,status,expires_at"
            )
            .eq(
                "id",
                receiverRoomId
            )
            .maybeSingle();


        if (roomError) {

            throw roomError;

        }


        if (!room) {

            throw new Error(
                "Room sudah dihapus."
            );

        }


        /*
        --------------------------------------------
        Cek expired
        --------------------------------------------
        */

        if (
            room.expires_at &&
            new Date(
                room.expires_at
            ) <= new Date()
        ) {

            throw new Error(
                "Room sudah kedaluwarsa."
            );

        }


        /*
        --------------------------------------------
        Download file
        --------------------------------------------
        */

        const {
            data: fileData,
            error:
                fileError
        } =
        await supabase
            .storage
            .from("files")
            .download(
                room.file_path
            );


        if (fileError) {

            throw fileError;

        }


        const url =
            URL.createObjectURL(
                fileData
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            room.file_name ||
            "download";


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        downloadStatus.textContent =
            "Download dimulai.";

    }
    catch(error) {

        console.error(error);

        downloadStatus.textContent =
            error.message ||
            "Download gagal.";

    }


    downloadButton.disabled =
        false;

};


/*
========================================================
DELETE ROOM
========================================================
*/

deleteRoomButton.onclick =
async function() {

    if (
        !hostRoomId ||
        !currentUser
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Hapus room dan file ini?"
        );


    if (!confirmed) {

        return;

    }


    deleteRoomButton.disabled =
        true;


    try {

        /*
        --------------------------------------------
        Ambil file
        --------------------------------------------
        */

        const {
            data,
            error
        } =
        await supabase
            .from("rooms")
            .select(
                "file_path"
            )
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            )
            .maybeSingle();


        if (error) {

            throw error;

        }


        if (!data) {

            throw new Error(
                "Room tidak ditemukan."
            );

        }


        /*
        --------------------------------------------
        Hapus Storage
        --------------------------------------------
        */

        if (
            data.file_path
        ) {

            const {
                error:
                    storageError
            } =
            await supabase
                .storage
                .from("files")
                .remove([
                    data.file_path
                ]);


            if (storageError) {

                throw storageError;

            }

        }


        /*
        --------------------------------------------
        Hapus room
        --------------------------------------------
        Requests ikut terhapus
        karena ON DELETE CASCADE
        --------------------------------------------
        */

        const {
            error:
                deleteError
        } =
        await supabase
            .from("rooms")
            .delete()
            .eq(
                "id",
                hostRoomId
            )
            .eq(
                "host_id",
                currentUser.id
            );


        if (deleteError) {

            throw deleteError;

        }


        stopHostPolling();


        localStorage.removeItem(
            "hostRoomId"
        );


        hostRoomId =
            null;


        requestList.innerHTML =
            "";


        requestCard.classList.add(
            "ft-hidden"
        );


        acceptedCard.classList.add(
            "ft-hidden"
        );


        showPage(
            homePage
        );

    }
    catch(error) {

        console.error(error);

        alert(
            error.message ||
            "Gagal menghapus room."
        );

    }


    deleteRoomButton.disabled =
        false;

};
