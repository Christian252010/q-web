<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="template.css">
  <title>FPB & KPK</title>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-title="FPB & KPK">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

.sidebarr-search input{
  width: 103.5% !important;
}

body{
  background: var(--bg);
  color: var(--text);
  display:flex;
  justify-content:center;
  padding:20px;
}

.container{
  margin-top: 50px;
  width:100%;
  max-width:700px;
  background: var(--card);
  border-radius:10px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
}

h1{
  text-align:center;
  margin-bottom:20px;
}

textarea{
  width:100%;
  min-height: 120px;
  resize:none;
  border:none;
  outline:none;
  border-radius:8px;
  padding:15px;
  font-size:18px;
  background:var(--sp);
  color:var(--text);
}

.middle{
  display:flex;
  justify-content:center;
  margin:15px 0;
}

.swap{
  display:flex;
  justify-content:center;
  align-items:center;
  border:none;
  background:none;
  color:var(--text);
  font-size:28px;
  cursor:pointer;
  transition:transform 0.3s ease;
  -webkit-tap-highlight-color:transparent;
}

.swap:hover{
  transform:scale(1.1);
}

.label{
  margin-bottom:4px;
  font-size:16px;
  margin-left:4px;
  opacity:0.7;
  font-weight:bold;
}

#copyBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:white;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

#copyBtn:active{
  transform:scale(1.02);
}

.topbar{
  display:flex;
  justify-content:flex-end;
  margin-right:2px;
  margin-bottom:-4px;
}

#resetBtn{
  position:absolute;
  width:18px;
  height:18px;
  border:none;
  border-radius:8px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.7;
  transition:.2s;
  z-index:6;
  -webkit-tap-highlight-color:transparent;
}

#resetBtn:active{
  transform:scale(.96);
}

#output {
  width: 100%;
  min-height: 80px;
  padding: 15px;
  border-radius: 8px;
  background: var(--sp);
  color: var(--text);
}

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 18px;
  line-height: 1.8;
}

.result-row span:last-child {
  text-align: right;
}
</style>

<div id="fetch-container"></div>

<div class="container">

  <div class="topbar">
    <button id="resetBtn">
      <i data-lucide="rotate-ccw"></i>
    </button>
  </div>

  <div class="label">Angka</div>
  <textarea
    inputmode="decimal"
    id="input"
    placeholder="Masukkan angka"
  ></textarea>

<!--  <div class="middle">
    <button class="swap" id="swap">
      <i data-lucide="arrow-up-down"></i>
    </button>
  </div>-->

  <div class="label">Hasil</div>
  
  <div id="output">
    <div class="result-row">
      <span>FPB</span>
      <span id="fpbResult">0</span>
    </div>
  
    <div class="result-row">
      <span>KPK</span>
      <span id="kpkResult">0</span>
    </div>
  </div>

<!--  <button id="copyBtn">
    <i data-lucide="copy"></i>
    <span>Copy Hasil</span>
  </button>-->

</div>

<script src="fetch.js"></script>

<script>
lucide.createIcons();

const input = document.getElementById("input");
const fpbResult = document.getElementById("fpbResult");
const kpkResult = document.getElementById("kpkResult");
const resetBtn = document.getElementById("resetBtn");
const copyBtn = document.getElementById("copyBtn");


/* =========================
   FPB 2 ANGKA
========================= */

function fpb(a, b) {

  a = Math.abs(a);
  b = Math.abs(b);

  while (b !== 0) {

    let temp = b;
    b = a % b;
    a = temp;

  }

  return a;
}


/* =========================
   KPK 2 ANGKA
========================= */

function kpk(a, b) {

  if (a === 0 || b === 0) {
    return 0;
  }

  return Math.abs(a * b) / fpb(a, b);

}


/* =========================
   FPB BANYAK ANGKA
========================= */

function calculateFPB(numbers) {

  return numbers.reduce((hasil, angka) => {

    return fpb(hasil, angka);

  });

}


/* =========================
   KPK BANYAK ANGKA
========================= */

function calculateKPK(numbers) {

  return numbers.reduce((hasil, angka) => {

    return kpk(hasil, angka);

  });

}


/* =========================
   MENGAMBIL ANGKA DARI INPUT
========================= */

function getNumbers() {

  return input.value
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line !== "")
    .map(line => Number(line))
    .filter(number => Number.isInteger(number));

}


/* =========================
   CONVERT / HITUNG
========================= */

function convert() {

  const numbers = getNumbers();

  if (numbers.length === 0) {
    fpbResult.textContent = "0";
    kpkResult.textContent = "0";
    return;
  }

  if (numbers.length === 1) {
    fpbResult.textContent = Math.abs(numbers[0]);
    kpkResult.textContent = Math.abs(numbers[0]);
    return;
  }

  const hasilFPB = calculateFPB(numbers);
  const hasilKPK = calculateKPK(numbers);

  fpbResult.textContent = hasilFPB;
  kpkResult.textContent = hasilKPK;
}


/* =========================
   INPUT
========================= */

input.addEventListener("input", () => {

  /*
   * Hanya mengizinkan:
   * 0-9
   * Enter
   * tanda minus
   */

  input.value = input.value.replace(/[^\d\n-]/g, "");

  convert();

});


/* =========================
   COPY HASIL
========================= */

copyBtn.addEventListener("click", () => {

  navigator.clipboard.writeText(output.value);

});


/* =========================
   RESET
========================= */

resetBtn.addEventListener("click", () => {

  input.value = "";

  output.value =
`FPB                 0
KPK                 0`;

});
</script>

</body>
</html>
