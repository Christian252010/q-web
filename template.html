}

}

<script>
  lucide.createIcons();
  
  const current = location.pathname.split("/").pop();
  document.querySelectorAll(".dock a").forEach(btn => {
    if (btn.getAttribute("href") === current) {
      btn.classList.add("active");
    }
  });
</script>
<script>
const btnRight = document.getElementById("btnRight");
const sidebarS = document.querySelector(".sidebar");
const sidebarA = document.querySelectorAll(".sidebar a");

let status = "normal";

function function1() {
  sidebarS.classList.remove("right");

  sidebarA.forEach(menu => {
    menu.classList.remove("right");
  });

  btnRight.classList.remove("active");

  status = "normal";
}

function function2() {
  sidebarS.classList.add("right");

  sidebarA.forEach(menu => {
    menu.classList.add("right");
  });

  btnRight.classList.add("active");

  status = "right";
}

// Kondisi awal
function1();

btnRight.addEventListener("click", function () {
  if (status === "normal") {
    function2();
  } else {
    function1();
  }
});
</script>
<script>
  lucide.createIcons();

  const btn24 = document.getElementById("toggle");
  let isOn = true;

  btn24.addEventListener("click", () => {
    isOn = !isOn;

    // Ganti icon
    btn.innerHTML = `<i data-lucide="${isOn ? 'sun' : 'moon'}"></i>`;

    // Render ulang icon lucide
    lucide.createIcons();
  });
</script>
<script>
const btn = document.getElementById("toggle");
const icon = document.getElementById("icon");

// Update UI (theme + icon)
function updateUI() {
  const isDark = document.body.classList.contains("dark");

  // HAPUS ICON LAMA (WAJIB)
  icon.innerHTML = "";

  if (isDark) {
    icon.setAttribute("data-lucide", "moon");
    localStorage.setItem("theme", "dark");
  } else {
    icon.setAttribute("data-lucide", "sun");
    localStorage.setItem("theme", "light");
  }

  // Render ulang icon (sekali)
  lucide.createIcons();
}

// Load awal dari localStorage
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

// Set tampilan awal
updateUI();

// Event toggle
btn.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  updateUI();
});
  
const searchInput = document.getElementById("sidebarrSearch");
const menuBoxes = document.querySelectorAll(".sidebar-menu a");

searchInput.addEventListener("keyup", function() {
  const filter = this.value.toLowerCase();

  menuBoxes.forEach(box => {
    const label = box.querySelector("span").innerText.toLowerCase();
    box.style.display = label.includes(filter) ? "flex" : "none";
  });
});

function home() {
  window.location.href = 'index.html';
}
</script>
