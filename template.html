.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 9;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #1c1c1c;

  padding: 4px 0;
}

.dock a {
  text-decoration: none;
  display: flex;
  justify-content: center;
  align-items: center;
}

.icon-box {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 6px 0;
  padding: 10px 12px;
  border-radius: 6px;
}

.icon-box svg {
  width: 26px;
  height: 26px;
  stroke: white;
  transition: 0.2s;
}

.dock a.active .icon-box {
  background: #008080;
}

.dock a.active .icon-box svg {
  stroke: black;
}

/* Tambahan agar konten tidak tertutup dock */
body {
  padding-bottom: 70px;
}
</style>

<script>
  lucide.createIcons();
  
  const current = location.pathname.split("/").pop();
  document.querySelectorAll(".dock a").forEach(btn => {
    if (btn.getAttribute("href") === current) {
      btn.classList.add("active");
    }
  });
</script>
<script>
  lucide.createIcons();

  const btn24 = document.getElementById("toggle");
  let isOn = true;

  btn24.addEventListener("click", () => {
    isOn = !isOn;

    // Ganti icon
    btn.innerHTML = `<i data-lucide="${isOn ? 'sun' : 'moon'}"></i>`;

    // Render ulang icon lucide
    lucide.createIcons();
  });
</script>
<script>
const btn = document.getElementById("toggle");
const icon = document.getElementById("icon");

// Update UI (theme + icon)
function updateUI() {
  const isDark = document.body.classList.contains("dark");

  // HAPUS ICON LAMA (WAJIB)
  icon.innerHTML = "";

  if (isDark) {
    icon.setAttribute("data-lucide", "moon");
    localStorage.setItem("theme", "dark");
  } else {
    icon.setAttribute("data-lucide", "sun");
    localStorage.setItem("theme", "light");
  }

  // Render ulang icon (sekali)
  lucide.createIcons();
}

// Load awal dari localStorage
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

// Set tampilan awal
updateUI();

// Event toggle
btn.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  updateUI();
});
  
const searchInput = document.getElementById("sidebarrSearch");
const menuBoxes = document.querySelectorAll(".sidebar-menu a");

searchInput.addEventListener("keyup", function() {
  const filter = this.value.toLowerCase();

  menuBoxes.forEach(box => {
    const label = box.querySelector("span").innerText.toLowerCase();
    box.style.display = label.includes(filter) ? "flex" : "none";
  });
});
</script>
