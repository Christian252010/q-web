<style>
body{
  font-family:Arial,sans-serif;
  background: var(--bg);
  padding:12px
}

h1{
  color: mediumseagreen;
  font-family: minecraft;
  text-align: center;
  font-size: 3em;
  margin-bottom: 20px;
  margin-top: 40px;
  text-shadow: 0 1px 0 rgba(255,255,255,.4),0 5px 0 seagreen;
  letter-spacing: 2px;
}

.card{
  max-width:720px;
  margin:0 auto 16px;
  color: var(--text);
  background: var(--card);
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,0.3)
}

.sub,.sub2{font-size:.8em;color:#888}

.day-item.spesial {
  display: flex;
  justify-content: space-between;
  text-align: center;
}

.now{
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:bold;
  border:3px solid var(--accent);
  padding:14px;
  border-radius:10px
}

.now-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
}

.now-left{
  display:flex;
  gap:8px;
  align-items:center;
}

.now-time{
  font-size:0.9em;
  color:#999;
  white-space:nowrap;
}

.row{padding:8px 0}
.row+.row{border-top:1px solid #ccc}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center
  padding: 8px;
}

.left{display:flex;gap:8px;align-items:center}
.time{color:#999;font-size:.85em;margin-top:3px;}

/*.active{
  background:rgba(0,0,0,0.1);
  padding: 8px;
  border-radius:8px
  border-top: none;
}*/

.spesial{
  background: var(--sp);
  padding:8px;
  border-radius:8px
}

.day-item.spesial + .day-item.spesial {margin-top: 4px;border-top: none;}
.row.spesial + .row.spesial {margin-top: 5px;border-top: none;}

.libur{
  color:#d9534f;
  font-weight:bold;
  text-align:center;
  font-size:1.1em
}

.tgl-b {
  display: flex;
  justify-content: center;
}

.toggle-btn {
  width:100%;
  max-width:750px;
  padding:12px;
  background: var(--accent);
  color:#fff;
  border:none;
  border-radius:10px;
  font-size: 18px;
  font-weight:bold;
  box-shadow: 0 1px 0 rgba(255,255,255,.4),0 5px 0 var(--daccent);
  margin-bottom:22px
}

.toggle-btn:active {
  box-shadow: 0 1px 0 rgba(255,255,255,.4),0 2px 0 var(--daccent);
  transform: translateY(3px);
}

.full{display:none}

.day-box {
  border:2px solid var(--border);
  border-radius:10px;
  padding:10px;
  margin-bottom:12px
}

.judul-j {
  font-weight: bold;
  color: var(--accent);
  font-size:1.1em;
}

.judul-h{
  font-size:1.2em;
  margin-bottom: 6px;
}

/* Judul hari di Jadwal Full rata tengah */
.day-box > span{
  display:block;
  text-align:center;
}

.day-box:nth-child(7) {
  margin-top: 40px;
}

.day-item{
  display:flex;
  justify-content:space-between;
  padding:6px 12px;
  border-top:2px solid var(--border);
}
.day-item:first-child{border-top:none}
</style>

<body data-title="Jadwal">

<div id="fetch-container"></div>

<br>
<div class="now card" id="nowInfo"></div>

<div class="card">
  <div id="weekInfo"></div>
  <div id="dayInfo"></div>
  <div id="jadwalMapel"></div>
</div>

<div class="card">
  <div id="jadwalSpesial"></div>
</div>
</div>

  <button class="toggle-btn" onclick="toggleFull()">Jadwal Full</button>
</div>
<div class="card full" id="jadwalGanjil"></div>
<div class="card full" id="jadwalGenap"></div>

<div id="popupContainer" style="display:none;"></div>

<script src="fetch.js"></script>
<script>
/* ===== UTIL ===== */
const hariNama=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const toMin = t => {
  const [a,b] = t.replace(".",":").split(":").map(Number);
  return a*60 + b;
};

/* ===== ICON ===== */
const mapelIcon={
  "Matematika":"calculator","B.Indonesia":"notebook-pen","B.Inggris":"languages",
  "Agama":"moon-star","Pemrograman Mobile":"monitor","Kejuruan":"server",
  "KIK":"chart-no-axes-combined","Olahraga":"dumbbell","Sejarah":"scroll",
  "PPKN":"landmark","B.Jawa":"feather","Koding":"code-xml","BK":"user"
};
const spesialIcon={
  "Upacara":"flag","Istirahat":"coffee",
  "Dzuhur":"moon","Sholat Jumat":"star","Ashar":"moon"
};

/* ===== SIMULASI ===== */
function getNow(){
  const d=localStorage.getItem("fakeDate");
  const t=localStorage.getItem("fakeTime");
  return (d&&t)?new Date(d+"T"+t):new Date();
}
function applyFake(){
  if(!fakeDate.value||!fakeTime.value) return alert("Isi tanggal & jam");
  localStorage.setItem("fakeDate",fakeDate.value);
  localStorage.setItem("fakeTime",fakeTime.value);
  location.reload();
}
function clearFake(){localStorage.clear();location.reload()}

/* ===== JADWAL ===== */
const jadwalA={
1:[{jam:"07.45-10.05",mapel:"Pemrograman Mobile"},{jam:"10.30-15.15",mapel:"Kejuruan"}],
2:[{jam:"07.00-09.55",mapel:"Koding"},{jam:"10.15-11.25",mapel:"BK"},{jam:"11.25-15.15",mapel:"Kejuruan"}],
3:[{jam:"07.00-12.00",mapel:"Kejuruan"},{jam:"13.00-15.15",mapel:"Pemrograman Mobile"}],
4:[{jam:"07.00-14.30",mapel:"Kejuruan"},{jam:"14.30-15.15",mapel:"BK"}],
5:[{jam:"07.15-14.05",mapel:"Kejuruan"}]
};

const jadwalB={
1:[{jam:"07.45-10.05",mapel:"B.Inggris"},{jam:"10.30-11.30",mapel:"Olahraga"},{jam:"11.30-14.05",mapel:"Matematika"},{jam:"14.05-15.15",mapel:"B.Indonesia"}],
2:[{jam:"07.00-09.15",mapel:"Agama"},{jam:"09.15-10.50",mapel:"Sejarah"},{jam:"10.50-14.05",mapel:"B.Indonesia"},{jam:"14.05-15.15",mapel:"PPKN"}],
3:[{jam:"07.00-08.35",mapel:"PPKN"},{jam:"08.35-09.55",mapel:"B.Jawa"},{jam:"10.15-12.00",mapel:"Matematika"},{jam:"13.00-15.15",mapel:"B.Inggris"}],
4:[{jam:"07.00-08.35",mapel:"Olahraga"},{jam:"08.35-12.00",mapel:"KIK"},{jam:"13.00-14.30",mapel:"Sejarah"},{jam:"14.30-15.15",mapel:"B.Jawa"}],
5:[{jam:"07.15-09.15",mapel:"Agama"},{jam:"09.15-14.05",mapel:"KIK"}]
};

const spesial={
1:[{jam:"07.00-07.45",nama:"Upacara"},{jam:"10.05-10.30",nama:"Istirahat"},{jam:"12.00-12.55",nama:"Dzuhur"},{jam:"15.15-15.30",nama:"Ashar"}],
2:[{jam:"09.55-10.15",nama:"Istirahat"},{jam:"12.00-12.55",nama:"Dzuhur"},{jam:"15.15-15.30",nama:"Ashar"}],
3:[{jam:"09.55-10.15",nama:"Istirahat"},{jam:"12.00-13.00",nama:"Dzuhur"},{jam:"15.15-15.30",nama:"Ashar"}],
4:[{jam:"09.55-10.15",nama:"Istirahat"},{jam:"12.00-13.00",nama:"Dzuhur"},{jam:"15.15-15.30",nama:"Ashar"}],
5:[{jam:"09.55-10.10",nama:"Istirahat"},{jam:"11.30-12.45",nama:"Sholat Jumat"}]
};

/* ===== LOGIKA WAKTU FIX ===== */
const now=getNow();
const jamNow=now.getHours()*60+now.getMinutes();
const isBesok = jamNow >= 1020; // 17.00+

const tgl=new Date(now);
if(isBesok) tgl.setDate(tgl.getDate()+1);
const hari=tgl.getDay();
const hariAsli = now.getDay(); // hari sebenarnya (untuk NOW)

const startA=new Date("2026-08-08");
const isA=Math.floor((tgl-startA)/(1000*60*60*24*7))%2===0;
const aktif=isA?jadwalA:jadwalB;

weekInfo.innerHTML=`<b>${isA?"Jadwal Ganjil":"Jadwal Genap"}</b>`;
dayInfo.innerHTML=isBesok?`<div class="sub">Besok (${hariNama[hari]})</div>`:`<b class="sub2">${hariNama[hari]}</b>`;

/* ===== RENDER ===== */
let nowText=null;
let nowJam=null;
let nowIcon="clock";
jadwalMapel.innerHTML="";
jadwalSpesial.innerHTML="";

if(hari===0||hari===6){
  jadwalMapel.innerHTML=`<div class="libur">Libur</div>`;
}else{
  (aktif[hari]||[]).forEach(j=>{
    const[a,b]=j.jam.split("-");
    const on =
      hari === hariAsli &&
      jamNow >= toMin(a) &&
      jamNow < toMin(b);
    if(on){
      nowText = j.mapel;
      nowJam = j.jam;
      nowIcon = mapelIcon[j.mapel] || "book";
    }
    jadwalMapel.innerHTML+=`
    <div class="row ${on?"active":""}">
      <div class="item">
        <div class="left"><i data-lucide="${mapelIcon[j.mapel]||"book"}"></i><span class="mapel">${j.mapel}</span></div>
        <span class="time">${j.jam}</span>
      </div>
    </div>`;
  });

  (spesial[hari]||[]).forEach(j=>{
    const[a,b]=j.jam.split("-");
    const on =
      hari === hariAsli &&
      jamNow >= toMin(a) &&
      jamNow < toMin(b);
    if(on){
      nowText = j.nama;
      nowJam = j.jam;
      nowIcon = spesialIcon[j.nama] || "clock";
    }
    jadwalSpesial.innerHTML+=`
    <div class="row spesial ${on?"active":""}">
      <div class="item">
        <div class="left">${spesialIcon[j.nama]?`<i data-lucide="${spesialIcon[j.nama]}"></i>`:""}<span class="mapel">${j.nama}</span></div>
        <span class="time">${j.jam}</span>
      </div>
    </div>`;
  });
}

nowInfo.innerHTML = nowText
?`
<div class="now-content">
  <div class="now-left">
    <i data-lucide="${nowIcon}"></i>
    <span>${nowText}</span>
  </div>
  <span class="now-time">${nowJam}</span>
</div>
`
:`<i data-lucide="alarm-clock-off"></i> Tidak ada jadwal`;



/* ===== FULL ===== */
function toggleFull(){
  const show = jadwalGanjil.style.display !== "block";
  jadwalGanjil.style.display = show ? "block" : "none";
  jadwalGenap.style.display  = show ? "block" : "none";
}  

function renderFull(title,data){
  return `<div class="day-box">
    <span class="judul-j switchable" onclick="swapJadwal()">${title}</span>
  </div>`+
  Object.entries(data).map(([d,v])=>`
  <div class="day-box"><span class="judul-h">${hariNama[d]}</span>

  ${v.map(m=>`
    <div class="day-item">
      <span>
        <i class="icf" data-lucide="${mapelIcon[m.mapel] || "book"}"></i>
        <span class="mapel">${m.mapel}</span>
      </span>
      <span class="time">${m.jam}</span>
    </div>
  `).join("")}

  ${(spesial[d]||[]).map(s=>`
    <!--<div class="day-item spesial">
      <span><span class="mapel">${s.nama}</span></span>
      <span class="time">${s.jam}</span>
    </div>-->
  `).join("")}

  </div>`).join("");
}

/* =========================
   🔥 AUTO URUT
========================= */
function urutkanJadwal(){
  const parent = jadwalGanjil.parentNode;

  if(isA){
    parent.insertBefore(jadwalGanjil, jadwalGenap);
  }else{
    parent.insertBefore(jadwalGenap, jadwalGanjil);
  }
}

/* =========================
   🔥 SWITCH MANUAL
========================= */
function swapJadwal(){
  const parent = jadwalGanjil.parentNode;

  if(jadwalGanjil.nextElementSibling === jadwalGenap){
    parent.insertBefore(jadwalGenap, jadwalGanjil);
  }else{
    parent.insertBefore(jadwalGanjil, jadwalGenap);
  }
}

function tandaiAktif(){
  if(isA){
    const el = jadwalGanjil.querySelector(".judul-j");
    if(el && !el.innerHTML.includes("")){
      el.innerHTML += " (Aktif)";
    }
  }else{
    const el = jadwalGenap.querySelector(".judul-j");
    if(el && !el.innerHTML.includes("")){
      el.innerHTML += "";
    }
  }
}

jadwalGanjil.innerHTML = renderFull("Jadwal Ganjil", jadwalA);
jadwalGenap.innerHTML  = renderFull("Jadwal Genap", jadwalB);

urutkanJadwal();
tandaiAktif();

lucide.createIcons();


lucide.createIcons();
</script>

/* =========================
   FORMAT TANGGAL
========================= */

function formatTanggalLengkap(tanggalString){

  const hariNama = [
    "Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"
  ];

  const t = new Date(tanggalString);

  const hari = hariNama[t.getDay()];

  const tanggal = String(t.getDate()).padStart(2,"0");

  const bulan = String(t.getMonth()+1).padStart(2,"0");

  const tahun = t.getFullYear();

  return `${hari}, ${tanggal}-${bulan}-${tahun}`;
}

/* =========================
   POPUP
========================= */

function showPopup(mapel, ket, tanggal){

  const popup = document.createElement("div");

  popup.className = "popup-bg";

  popup.innerHTML = `
    <div class="popup-box">

      <div class="popup-title">
        ${mapel}
      </div>

      <div class="popup-ket">
        ${ket}
      </div>

      <div class="popup-date">
        ${formatTanggalLengkap(tanggal)}
      </div>

      <button class="popup-close">
        Tutup
      </button>

    </div>
  `;

  document.body.appendChild(popup);

  popup.querySelector(".popup-close").onclick = ()=>{
    popup.remove();
  };

}


/* =========================
   TAMPILKAN LABEL
========================= */

function tampilkanLabel(data){

  const today = new Date();

  today.setHours(0,0,0,0);

  const deadline = new Date(data.tanggal);

  deadline.setHours(0,0,0,0);

  if(deadline < today) return;


  const semuaMapel = document.querySelectorAll(".mapel");

  semuaMapel.forEach(el=>{

    const nama = el.textContent.trim().toLowerCase();

    if(nama === data.mapel.toLowerCase()){

      if(el.querySelector(".label-tugas")) return;

      const label = document.createElement("span");

      label.className = "label-tugas";

      label.innerText = " Tugas";

      label.style = `
        background:red;
        color:white;
        padding:2px 6px;
        margin-left:6px;
        border-radius:6px;
        font-size:10px;
        cursor:pointer;
      `;

      label.onclick = ()=>{
        showPopup(
          data.mapel,
          data.ket,
          data.tanggal
        );
      };

      el.appendChild(label);

    }

  });

}


/* =========================
   LOAD DATA
========================= */

function loadTugas(){

  const colRef = collection(db,"tugas");

  onSnapshot(colRef,(snapshot)=>{

    snapshot.forEach(doc=>{

      tampilkanLabel(doc.data());

    });

  });

}


/* =========================
   JALANKAN SETELAH HTML READY
========================= */

window.addEventListener("DOMContentLoaded", ()=>{

  loadTugas();

});

</script>
