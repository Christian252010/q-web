<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="template.css">
<script src="https://unpkg.com/lucide@latest"></script>
<title>Subnetting Calculator</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background: var(--bg);
  color: var(--text);
  padding:20px;
}

.sidebarr-search input{
  width: 103.5% !important;
}

.container{
  max-width:1100px;
  margin:auto;
}

.title{
  text-align:center;
  margin-bottom:20px;
}

.title h1{
  font-size:32px;
}

.card{
  background: var(--card);
  color: var(--text);
  border-radius:8px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(0,0,0,.3);
}

.input-group{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.input-box{
  flex:1;
  min-width:250px;
}

label{
  display:block;
  margin-bottom:0px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  background: var(--sp);
  color: var(--text);
  font-size:16px;
}

input:focus {
  outline: none;
}

.input-group .input-box label {
  margin-left: 2px;
}

.input-box label {
  margin-top: 10px;
}

.inp {
  padding:12px 20px;
  border:none;
  border-radius:6px;
  background: var(--accent);
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
  width: 100%;
}

.inp:active{
  transform:scale(1.03);
}

#toggleBtn {
  background: none;
  border: none;
  color: var(--text);
  font-weight: 600;
}

.sbn {
  display: flex;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:15px;
}

.info{
  background: var(--sp);
  padding:15px;
  border-radius:6px;
}

.info h3{
  margin-bottom:10px;
  color: var(--text);
}

.info p {
  color: var(--text2);
}

.binary{
  font-size: 14px;
  word-break:break-word;
  line-height:1.7;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th, td{
  border:1px solid var(--bdr);
  padding:10px;
  text-align:center;
}

th{
  background: var(--accent);
  color: white;
}

tr {
  background: var(--tr);
}

tr:nth-child(even){
  background: var(--td);
}

.badge{
  display:inline-block;
  background:#2563eb;
  padding:5px 10px;
  border-radius:999px;
  margin-top:8px;
}

@media(max-width:700px){
  .title h1{
    font-size:24px;
  }
}

.table-wrapper{
  overflow-x:auto;
  margin-top:15px;
}

table{
  min-width:700px;
}
</style>
</head>
<body data-title="Subnetting">

<div id="fetch-container"></div>
<br>
<br>

<div class="container">

<!--  <div class="title">
    <h1>Subnetting Calculator</h1>
    <p>Perhitungan subnet lengkap otomatis</p>
  </div>-->

  <div class="card">

    <div class="input-group">

      <div class="input-box">
        <label>IP Address</label>
        <input
          type="text"
          id="ip"
          placeholder="Masukan IP"
          maxlength="15"
          inputmode="numeric"
        />
      </div>

      <div class="input-box">
        <label>Prefix /CIDR</label>
        <input
          type="text"
          id="cidr"
          placeholder="Masukan Perfix"
          maxlength="2"
          inputmode="numeric"
        >
      </div>

    </div>

    <div
      id="errorText"
      style="
        color:#ef4444;
        font-size:14px;
        margin-bottom:8px;
        margin-top: 8px;
        margin-left: 4px;
        min-height:18px;
      "
    ></div>

    <button onclick="calculateSubnet()" class="inp">
      Hitung Subnet
    </button>

  </div>

  <div id="result"></div>

</div>

<script src="fetch.js"></script>
<script>

function ipToBinary(ip){
  return ip.split(".")
    .map(octet => parseInt(octet)
    .toString(2)
    .padStart(8,"0"))
    .join(".");
}

function getClass(first){
  if(first >=1 && first <=126){
    return "A";
  }else if(first >=128 && first <=191){
    return "B";
  }else if(first >=192 && first <=223){
    return "C";
  }else if(first >=224 && first <=239){
    return "D";
  }else if(first >=240 && first <=255){
    return "E";
  }else{
    return "Tidak Valid";
  }
}

function cidrToMask(cidr){

  let mask = [];
  let remaining = cidr;

  for(let i=0;i<4;i++){

    let octet = 0;

    for(let j=0;j<8;j++){

      if(remaining > 0){
        octet += (1 << (7-j));
        remaining--;
      }

    }

    mask.push(octet);

  }

  return mask.join(".");
}

function calculateSubnet(){

  const ip = document.getElementById("ip").value.trim();
  const cidr = parseInt(document.getElementById("cidr").value);

  const errorText = document.getElementById("errorText");

  errorText.innerText = "";

  if(!ip || isNaN(cidr)){
  
    errorText.innerText = "IP atau Prefix belum diisi";
  
    return;
  }

  const octets = ip.split(".").map(Number);

  if(
    octets.length !== 4 ||
    octets.some(n => isNaN(n) || n < 0 || n > 255)
  ){

    errorText.innerText = "IP tidak valid";

    return;
  }

  const dotCount = (ip.match(/\./g) || []).length;
  
  if(dotCount !== 3){
  
    errorText.innerText = "Format IP harus lengkap";
  
    return;
  }


  const firstOctet = octets[0];
  const ipClass = getClass(firstOctet);

  let defaultPrefix = 0;

  if(ipClass === "A") defaultPrefix = 8;
  else if(ipClass === "B") defaultPrefix = 16;
  else if(ipClass === "C") defaultPrefix = 24;

  const subnetBits = cidr - defaultPrefix;
  const hostBits = 32 - cidr;

  const totalSubnet = subnetBits >= 0
    ? Math.pow(2, subnetBits)
    : "CIDR lebih kecil dari default class";

  const totalHosts = hostBits > 0
    ? Math.pow(2, hostBits) - 2
    : 0;

  const subnetMask = cidrToMask(cidr);

  const maskOctets = subnetMask.split(".").map(Number);

  let block = 0;
  let subnetIndex = 0;

  for(let i=0;i<4;i++){

    if(maskOctets[i] !== 255){

      block = 256 - maskOctets[i];
      subnetIndex = i;
      break;

    }

  }

  if(block === 0){
    block = 256;
    subnetIndex = 3;
  }

  let subnetJumpList = [];

  for(let i=0;i<256;i+=block){
    subnetJumpList.push(i);
  }

  let subnetList = [];

  for(let i=0;i<256;i+=block){

    let subnet = [...octets];
    subnet[subnetIndex] = i;

    for(let j=subnetIndex+1;j<4;j++){
      subnet[j] = 0;
    }

    let firstHost = [...subnet];
    firstHost[3] += 1;

    let broadcast = [...subnet];

    if(subnetIndex === 3){

      broadcast[3] = i + block - 1;

    }else{

      broadcast[subnetIndex] = i + block - 1;

      for(let j=subnetIndex+1;j<4;j++){
        broadcast[j] = 255;
      }

    }

    let lastHost = [...broadcast];
    lastHost[3] -= 1;

    subnetList.push({
      subnet: subnet.join("."),
      firstHost: firstHost.join("."),
      lastHost: lastHost.join("."),
      broadcast: broadcast.join(".")
    });

  }

  const binaryMask = ipToBinary(subnetMask);

  const previewList = subnetJumpList.slice(0,6);
  const remainingList = subnetJumpList.slice(6);

  const previewSubnet = previewList.join(", ");
  const remainingSubnet = remainingList.join(", ");

  document.getElementById("result").innerHTML = `

  <div class="card">

    <h2>Informasi Subnet</h2>

    <div class="result-grid">

      <div class="info">
        <h3>IP Address</h3>
        <p>${ip}</p>
      </div>

      <div class="info">
        <h3>Class</h3>
        <p>${ipClass}</p>
      </div>

      <!--<div class="info">
        <h3>Default Prefix</h3>
        <p>/${defaultPrefix}</p>
      </div>-->

      <div class="info">
        <h3>CIDR</h3>
        <p>/${cidr}</p>
      </div>

      <div class="info">
        <h3>Subnet Bits (n)</h3>
        <p>${subnetBits}</p>
      </div>

      <div class="info">
        <h3>Host Bits (m)</h3>
        <p>${hostBits}</p>
      </div>

      <div class="info">
        <h3>Jumlah Subnet</h3>
        <p>2<sup>${subnetBits}</sup> = ${totalSubnet}</p>
      </div>

      <div class="info">
        <h3>Total Host</h3>
        <p>2<sup>${hostBits}</sup> - 2 = ${totalHosts}</p>
      </div>

      <div class="info">
        <h3>Subnet Mask</h3>
        <p>${subnetMask}</p>
      </div>

      <div class="info">
        <h3>Binary Mask</h3>
        <div class="binary">${binaryMask}</div>
      </div>

      <div class="info">
        <h3>Block Size</h3>
        <p>${block}</p>
      </div>

      <div class="info">
        <h3>Daftar Subnet</h3>
          <p
            id="allSubnet"
            style="display:none;margin-top:10px;line-height:1.7;"
          >
            ${subnetJumpList.join(", ")}
          </p>
          <div class="sbn">
          <p id="previewSubnet">
            ${previewSubnet}${remainingList.length ? ", ..." : ""}
          </p>
          


        ${subnetJumpList.length > 6 ? `<button
            id="toggleBtn"
            style="margin-top:2px;color: var(--text2);"
            onclick="toggleSubnetList()"
          >
            Lihat Semua
          </button>
        ` : ""}
          </div>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>Tabel Subnet</h2>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>No</th>
            <th>Subnet</th>
            <th>IP Awal</th>
            <th>IP Akhir</th>
            <th>Broadcast</th>
          </tr>
        </thead>

        <tbody>

          ${subnetList.map((s,index)=>`

            <tr>
              <td>${index+1}</td>
              <td>${s.subnet}</td>
              <td>${s.firstHost}</td>
              <td>${s.lastHost}</td>
              <td>${s.broadcast}</td>
            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>

  </div>

  `;

}

function toggleSubnetList(){

  const preview = document.getElementById("previewSubnet");
  const all = document.getElementById("allSubnet");
  const button = document.getElementById("toggleBtn");

  if(all.style.display === "none"){

    preview.style.display = "none";
    all.style.display = "block";

    button.innerText = "Sembunyikan...";

  }else{

    preview.style.display = "block";
    all.style.display = "none";

    button.innerText = "Lihat Semua";

  }

}

const cidrInput = document.getElementById("cidr");

cidrInput.addEventListener("input", () => {

  let value = cidrInput.value;

  // hapus semua selain angka
  value = value.replace(/[^0-9]/g, "");

  // maksimal 2 digit
  value = value.slice(0,2);

  // digit pertama
  if(value.length >= 1){

    // jika pertama 0 → hapus
    if(value[0] === "0"){
      value = "";
    }

  }

  // digit kedua
  if(value.length === 2){

    const first = parseInt(value[0]);
    const second = parseInt(value[1]);

    // jika pertama 3
    if(first === 3 && second > 2){

      value = value[0];

    }

    // jika pertama >3
    if(first > 3){

      value = value[0];

    }

  }

  cidrInput.value = value;

});

const ipInput = document.getElementById("ip");

ipInput.addEventListener("keydown", (e) => {

  const allowedKeys = [
    "Backspace",
    "Delete",
    "ArrowLeft",
    "ArrowRight",
    "Tab"
  ];

  if(allowedKeys.includes(e.key)) return;

  // blok spasi koma minus
  if(/[,\-\s]/.test(e.key)){
    e.preventDefault();
    return;
  }

  // hanya angka dan titik
  if(!/[0-9.]/.test(e.key)){
    e.preventDefault();
    return;
  }

  const value = ipInput.value;

  // ======================
  // VALIDASI TITIK
  // ======================

  if(e.key === "."){

    // tidak boleh di awal
    if(value.length === 0){
      e.preventDefault();
      return;
    }

    // tidak boleh setelah titik
    if(value.endsWith(".")){
      e.preventDefault();
      return;
    }

    // maksimal 3 titik
    const dotCount = (value.match(/\./g) || []).length;

    if(dotCount >= 3){
      e.preventDefault();
      return;
    }

    return;
  }

  // ======================
  // VALIDASI ANGKA
  // ======================

  let parts = value.split(".");
  let currentPart = parts[parts.length - 1];

  // tidak boleh 0 di awal blok
/*  if(currentPart.length === 0 && e.key === "0"){
    e.preventDefault();
    return;
  }*/
  
  // digit pertama
  if(currentPart.length === 0){
    return;
  }
  
  // jika digit pertama 0
  // digit kedua tidak boleh angka
  if(currentPart.length === 1){
  
    const first = currentPart[0];
  
    if(first === "0"){
      e.preventDefault();
      return;
    }
  
  }


  // maksimal 3 digit
  if(currentPart.length >= 3){
    e.preventDefault();
    return;
  }

  // simulasi angka setelah diketik
  const nextValue = currentPart + e.key;
  const nextNumber = parseInt(nextValue);
  // jika digit pertama > 3
// maka digit kedua tidak boleh diketik
  if(currentPart.length === 1){
  
    const first = parseInt(currentPart[0]);
  
    if(first > 3){
      e.preventDefault();
      return;
    }
  
  }
  // tidak boleh >255
  if(nextNumber > 255){
    e.preventDefault();
    return;
  }

});

ipInput.addEventListener("input", () => {

  let value = ipInput.value;

  // hanya angka dan titik
  value = value.replace(/[^0-9.]/g, "");

  // tidak boleh titik di awal
  if(value.startsWith(".")){
    value = value.substring(1);
  }

  // tidak boleh titik dobel
  value = value.replace(/\.{2,}/g, ".");

  // maksimal 3 titik
  let dotCount = (value.match(/\./g) || []).length;

  if(dotCount > 3){

    let chars = [];
    let count = 0;

    for(let char of value){

      if(char === "."){

        count++;

        if(count > 3){
          continue;
        }

      }

      chars.push(char);

    }

    value = chars.join("");

  }

  let parts = value.split(".");

  // maksimal 4 blok
  parts = parts.slice(0,4);

  // maksimal 3 digit per blok
  parts = parts.map(part => part.slice(0,3));

  value = parts.join(".");

  ipInput.value = value;

});
</script>

</body>
</html>
