<style>
body {
  font-family: Arial;
  background: var(--bg);
  color: white;
  padding: 20px;
}

.container {
  max-width: 420px;
  margin: auto;
}

.input-box {
  background: var(--card);
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 15px;
  box-shadow:0 2px 12px rgba(0,0,0,0.3)
}

#amount, #result {
  width: 93.5%;
  border-radius: 6px;
  padding: 10px;
  font-size: 18px;
  background: var(--ins);
  border: none;
  color: var(--text);
  outline: none;
  box-shadow: inset 0px 0px 8px 1px rgba(0,0,0,0.1);
}

.dropdown {
  position: relative;
  margin-bottom: 10px;
}

.selected {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: var(--sp);
  color: var(--text);
  border: 2px solid var(--bdr2);
  border-radius: 6px;
  cursor: pointer;
}

.options {
  position: absolute;
  width: 100%;
  max-height: 420px;
  overflow-y: auto;
  color: var(--text);
  background: var(--sp);
  border-radius: 6px;
  display: none;
  z-index: 10;
  margin-top: 10px;
  box-shadow:0 2px 12px rgba(0,0,0,0.3)
}

.option {
  padding: 10px;
  display: flex;
  border-bottom: 2px solid var(--bdr2);
  justify-content: space-between;
  cursor: pointer;
}

.option:hover {
  background: var(--accent);
}

.swap {
  text-align: center;
  cursor: pointer;
  margin: 10px 0;
  font-size: 20px;
  -webkit-tap-highlight-color: transparent;
  color: var(--ph);
}

.label{
  color: var(--text);
  margin-bottom:4px;
  font-size:17px;
  margin-left: 4px;
  opacity:0.7;
  font-weight: bold;
}

.search-box {
  position: sticky;
  top: 0;
  padding: 10px;
  background: var(--sp);
  z-index: 2;
  border-bottom: 2px solid var(--bdr2);
}

.search-box input {
  box-sizing: border-box;
  width: 100%;
  padding: 10px;
  border: 2px solid var(--bdr2);
  border-radius: 6px;
  outline: none;
  background: var(--ins);
  color: var(--text);
  font-size: 15px;
}

.search-box input::placeholder {
  color: var(--ph);
}
</style>

function getFlag(code) {
  let country = currencyToCountry[code];
  if (!country) return "🏳️";
  return country.replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
}

/* ========================= */

function getName(code) {
  return currencyNames[code] || code;
}

function formatID(num) {
  return new Intl.NumberFormat("id-ID", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(num);
}

function parseID(str) {
  return parseFloat(str.replace(/\./g, "").replace(",", "."));
}

async function loadRates() {
  try {
    const res = await fetch(
      "https://open.er-api.com/v6/latest/USD"
    );

    if (!res.ok) {
      throw new Error("Gagal mengambil kurs");
    }

    const data = await res.json();

    rates = data.rates;

    // Simpan kurs terakhir
    localStorage.setItem(
      "currencyRates",
      JSON.stringify(rates)
    );

  } catch (error) {

    // Gunakan kurs terakhir ketika offline
    const saved =
      localStorage.getItem("currencyRates");

    if (!saved) {
      alert(
        "Kurs belum tersedia. Buka halaman ini sekali saat online."
      );
      return;
    }

    rates = JSON.parse(saved);
  }

  currencies = Object.keys(rates).sort(
    (a, b) =>
      getName(a).localeCompare(getName(b), "id")
  );

  initDropdown("fromDropdown", "USD");
  initDropdown("toDropdown", "IDR");
}

function initDropdown(id, defaultVal) {
  let dropdown = document.getElementById(id);
  let selected = dropdown.querySelector(".selected");
  let options = dropdown.querySelector(".options");

  options.innerHTML = "";

  // =========================
  // SEARCH BOX
  // =========================
  let searchBox = document.createElement("div");
  searchBox.className = "search-box";

  let searchInput = document.createElement("input");
  searchInput.type = "text";
  searchInput.placeholder = "Cari mata uang...";

  searchBox.appendChild(searchInput);
  options.appendChild(searchBox);

  // =========================
  // MEMBUAT DAFTAR CURRENCY
  // =========================
  currencies.forEach(cur => {
    let name = getName(cur);
    let flag = getFlag(cur);

    let div = document.createElement("div");
    div.className = "option";

    div.innerHTML = `
      <span>${flag} ${name}</span>
      <span>${cur}</span>
    `;

    // Pilih currency
    div.onclick = () => {
      selected.innerHTML = `
        <span>${flag} ${name}</span>
        <span>${cur}</span>
      `;

      selected.dataset.value = cur;

      searchInput.value = "";

      // Tampilkan kembali semua option
      options.querySelectorAll(".option").forEach(option => {
        option.style.display = "flex";
      });

      closeAll();
      convert();
    };

    options.appendChild(div);
  });

  // =========================
  // SEARCH
  // =========================
  searchInput.addEventListener("input", function () {
    let keyword = this.value.toLowerCase().trim();

    options.querySelectorAll(".option").forEach(option => {
      let text = option.textContent.toLowerCase();

      if (text.includes(keyword)) {
        option.style.display = "flex";
      } else {
        option.style.display = "none";
      }
    });
  });

  // =========================
  // DEFAULT VALUE
  // =========================
  selected.innerHTML = `
    <span>${getFlag(defaultVal)} ${getName(defaultVal)}</span>
    <span>${defaultVal}</span>
  `;

  selected.dataset.value = defaultVal;

  // =========================
  // BUKA / TUTUP DROPDOWN
  // =========================
  selected.onclick = (e) => {
    e.stopPropagation();

    let isOpen = options.style.display === "block";

    closeAll();

    options.style.display = isOpen ? "none" : "block";

    if (!isOpen) {
      searchInput.focus();
    }
  };
}

function closeAll() {
  document.querySelectorAll(".options").forEach(o=>o.style.display="none");
}

document.addEventListener("click", (e)=>{
  if(!e.target.closest(".dropdown")) closeAll();
});

function convert() {
  let raw = document.getElementById("amount").value;
  let amount = parseID(raw);

  let from = document.querySelector("#fromDropdown .selected").dataset.value;
  let to = document.querySelector("#toDropdown .selected").dataset.value;

  if (!amount) return;

  let usd = amount / rates[from];
  let result = usd * rates[to];

  document.getElementById("result").value = formatID(result);
}

document.getElementById("amount").addEventListener("input", function(e){
  let val = e.target.value.replace(/[^0-9,]/g,"");
  let parts = val.split(",");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");
  e.target.value = parts.join(",");
  convert();
});

function swap() {
  let from = document.querySelector("#fromDropdown .selected");
  let to = document.querySelector("#toDropdown .selected");

  let tempHTML = from.innerHTML;
  let tempVal = from.dataset.value;

  from.innerHTML = to.innerHTML;
  from.dataset.value = to.dataset.value;

  to.innerHTML = tempHTML;
  to.dataset.value = tempVal;

  convert();
}

loadRates();
