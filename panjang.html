<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f5">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="template.css">
<title>Konversi Panjang</title><style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-wrap:wrap;
    padding:20px;
}

/* CARD */
.converter{
    display:flex;
    flex-direction:column;
    margin-top:50px;
    width:100%;
    max-width:600px;
    justify-content:center;
    align-items:center;
    background:var(--card);
    padding:25px;
    border-radius:8px;
    box-shadow:0 0 8px 4px rgba(0,0,0,.15);
}

/* TITLE */
h1{
    text-align:center;
    margin:0 0 25px;
    font-size:24px;
}

/* FIELD */
.field{
    width:100%;
    display:flex;
    flex-direction:column;
    margin-top:-6px;
    gap:8px;
}

.field2{
    margin-top:-18px;
}

label{
    color:var(--text);
    font-size:14px;
    font-weight:bold;
    margin-bottom:-6px;
}

/* CUSTOM DROPDOWN */
.custom-select{
    position:relative;
    width:100%;
}

.select-button{
    display:flex;
    width:100%;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px;
    border:2px solid var(--bdr2);
    border-radius:6px;
    color:var(--text);
    background:var(--sp);
    font-size:15px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

.select-button:hover{
    border-color:#999;
}

.selected-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.select-arrow{
    display:flex;
    align-items:center;
    flex-shrink:0;
    transition:transform .2s;
}

.select-arrow svg{
    width:18px;
    height:18px;
}

.custom-select.open .select-arrow{
    transform:rotate(180deg);
}

/* DROPDOWN MENU */
.select-menu{
    position:absolute;
    top:calc(100% + 5px);
    left:0;
    right:0;
    background:var(--card);
    border:1px solid var(--bdr2);
    border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    max-height:300px;
    overflow-y:auto;
    display:none;
    z-index:100;
    overscroll-behavior:contain;
}

.custom-select.open .select-menu{
    display:block;
}

/* OPTION */
.select-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:11px 12px;
    color:var(--text);
    cursor:pointer;
    border-bottom:1px solid var(--sp);
    font-size:14px;
    min-height:44px;
    transition:background .15s;
    -webkit-tap-highlight-color:transparent;
}

.select-option:last-child{
    border-bottom:none;
}

.select-option:hover{
    background:var(--ph);
}

.select-option.active{
    background:var(--accent);
    color:white;
    font-weight:bold;
}

.option-info{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.option-info svg{
    width:19px;
    height:19px;
    flex-shrink:0;
    stroke-width:1.8;
}

.option-info b{
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
}

.select-option.active .option-info b{
    font-weight:bold;
}

.option-symbol{
    color:var(--text);
    opacity:.65;
    margin-left:auto;
    flex-shrink:0;
    font-size:13px;
}

.select-option.active .option-symbol{
    color:white;
    opacity:.9;
}

/* INPUT */
#inputNumber{
    width:100%;
    background:var(--ins);
    color:var(--text);
    border:1px solid transparent;
    border-radius:6px;
    padding:10px;
    font-size:18px;
    outline:none;
    box-shadow:inset 0 0 8px 1px rgba(0,0,0,.1);
}

#inputNumber:focus{
    border-color:#777;
}

#inputNumber::placeholder{
    color:var(--text);
    opacity:.5;
}

/* SWAP */
.swap{
    width:44px;
    height:44px;
    color:var(--text);
    background:none;
    border:none;
    margin:15px auto;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:transform .2s,background .2s;
    border-radius:6px;
    -webkit-tap-highlight-color:transparent;
}

.swap svg{
    width:22px;
    height:22px;
}

.swap:active{
    transform:scale(1.08);
    background:var(--ph);
}

/* RESULT */
.result{
    width:100%;
}

.result-box{
    display:flex;
    align-items:center;
    padding:10px;
    width:100%;
    min-height:42px;
    border-radius:6px;
    background:var(--ins);
    color:var(--text);
    font-size:18px;
    overflow-wrap:anywhere;
    word-break:break-word;
    box-shadow:inset 0 0 8px 1px rgba(0,0,0,.1);
}

.error{
    margin-top:8px;
    color:crimson;
    font-size:13px;
    display:none;
    margin-bottom:-14px;
}

/* MOBILE */
@media(max-width:480px){
    body{
        padding:14px;
    }

    .converter{
        margin-top:35px;
        padding:18px;
    }

    .select-menu{
        max-height:260px;
    }
}
</style></head><body data-title="Panjang"><div id="fetch-container"></div><div class="converter"><!-- INPUT -->
<div class="field">
    <label for="inputNumber">Dari</label>

    <div class="custom-select" id="fromSelect">
        <div class="select-button" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
            <span class="selected-text">Kilometer - km</span>
            <span class="select-arrow">
                <i data-lucide="chevron-down"></i>
            </span>
        </div>
        <div class="select-menu" role="listbox"></div>
    </div>

    <input
        id="inputNumber"
        type="text"
        inputmode="decimal"
        placeholder="Masukkan panjang..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Nilai panjang"
    >
</div>

<!-- SWAP -->
<button
    class="swap"
    id="swapBtn"
    type="button"
    title="Tukar satuan"
    aria-label="Tukar satuan"
>
    <i data-lucide="arrow-down-up"></i>
</button>

<!-- OUTPUT -->
<div class="field field2">
    <label>Ke</label>

    <div class="custom-select" id="toSelect">
        <div class="select-button" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
            <span class="selected-text">Meter - m</span>
            <span class="select-arrow">
                <i data-lucide="chevron-down"></i>
            </span>
        </div>
        <div class="select-menu" role="listbox"></div>
    </div>

    <div class="result">
        <div class="result-box" id="result" aria-live="polite">-</div>
        <div class="error" id="error" role="alert">Nilai tidak valid.</div>
    </div>
</div>

</div><script src="fetch.js"></script><script>
/* =========================================
   SATUAN PANJANG
   Faktor konversi terhadap meter
========================================= */

const units = {
    km:{
        name:"Kilometer",
        symbol:"km",
        factor:1000,
        icon:"route"
    },
    hm:{
        name:"Hektometer",
        symbol:"hm",
        factor:100,
        icon:"milestone"
    },
    dam:{
        name:"Dekameter",
        symbol:"dam",
        factor:10,
        icon:"move-horizontal"
    },
    m:{
        name:"Meter",
        symbol:"m",
        factor:1,
        icon:"ruler"
    },
    dm:{
        name:"Desimeter",
        symbol:"dm",
        factor:0.1,
        icon:"between-horizontal-start"
    },
    cm:{
        name:"Centimeter",
        symbol:"cm",
        factor:0.01,
        icon:"scan"
    },
    mm:{
        name:"Milimeter",
        symbol:"mm",
        factor:0.001,
        icon:"grip"
    },
    in:{
        name:"Inch",
        symbol:"in",
        factor:0.0254,
        icon:"ruler"
    },
    ft:{
        name:"Foot",
        symbol:"ft",
        factor:0.3048,
        icon:"footprints"
    },
    yd:{
        name:"Yard",
        symbol:"yd",
        factor:0.9144,
        icon:"move-horizontal"
    },
    mi:{
        name:"Mile",
        symbol:"mi",
        factor:1609.344,
        icon:"map"
    },
    nmi:{
        name:"Nautical Mile",
        symbol:"nmi",
        factor:1852,
        icon:"ship"
    },
    ftm:{
        name:"Fathom",
        symbol:"ftm",
        factor:1.8288,
        icon:"waves"
    },
    ch:{
        name:"Chain",
        symbol:"ch",
        factor:20.1168,
        icon:"link"
    },
    rd:{
        name:"Rod",
        symbol:"rd",
        factor:5.0292,
        icon:"construction"
    }
};

/* =========================================
   STATE
========================================= */

let fromUnit = "km";
let toUnit = "m";

/* =========================================
   ELEMENT
========================================= */

const fromSelect = document.getElementById("fromSelect");
const toSelect = document.getElementById("toSelect");
const inputNumber = document.getElementById("inputNumber");
const result = document.getElementById("result");
const error = document.getElementById("error");
const swapBtn = document.getElementById("swapBtn");

/* =========================================
   UPDATE DROPDOWN TEXT
========================================= */

function updateSelectText(select,unit){
    const data = units[unit];

    select.querySelector(".selected-text").textContent =
        `${data.name} - ${data.symbol}`;
}

/* =========================================
   CREATE DROPDOWN OPTIONS + ICONS
========================================= */

function buildOptions(select,selectedUnit,onSelect){
    const menu = select.querySelector(".select-menu");
    menu.innerHTML = "";

    Object.keys(units).forEach(unit=>{
        const data = units[unit];
        const option = document.createElement("div");

        option.className = "select-option";
        option.setAttribute("role","option");
        option.setAttribute("aria-selected",String(unit === selectedUnit));
        option.dataset.unit = unit;

        if(unit === selectedUnit){
            option.classList.add("active");
        }

        const info = document.createElement("span");
        info.className = "option-info";

        const icon = document.createElement("i");
        icon.setAttribute("data-lucide",data.icon);

        const name = document.createElement("b");
        name.textContent = data.name;

        const symbol = document.createElement("span");
        symbol.className = "option-symbol";
        symbol.textContent = data.symbol;

        info.append(icon,name);
        option.append(info,symbol);

        option.addEventListener("click",()=>{
            onSelect(unit);
            closeDropdown(select);
        });

        menu.appendChild(option);
    });

    /* Render ikon Lucide di dalam dropdown */
    if(window.lucide){
        lucide.createIcons({
            nodes:menu.querySelectorAll("[data-lucide]")
        });
    }
}

/* =========================================
   UPDATE FROM DROPDOWN
========================================= */

function updateFromDropdown(){
    updateSelectText(fromSelect,fromUnit);

    buildOptions(fromSelect,fromUnit,unit=>{
        fromUnit = unit;
        updateFromDropdown();
        convert();
    });
}

/* =========================================
   UPDATE TO DROPDOWN
========================================= */

function updateToDropdown(){
    updateSelectText(toSelect,toUnit);

    buildOptions(toSelect,toUnit,unit=>{
        toUnit = unit;
        updateToDropdown();
        convert();
    });
}

/* =========================================
   CLOSE DROPDOWN
========================================= */

function closeDropdown(select){
    select.classList.remove("open");

    const button = select.querySelector(".select-button");
    button.setAttribute("aria-expanded","false");
}

/* =========================================
   TOGGLE DROPDOWN
========================================= */

function toggleDropdown(select){
    const willOpen = !select.classList.contains("open");

    document.querySelectorAll(".custom-select").forEach(item=>{
        closeDropdown(item);
    });

    if(willOpen){
        select.classList.add("open");
        select.querySelector(".select-button").setAttribute("aria-expanded","true");
    }
}

/* =========================================
   INITIALIZE DROPDOWNS
========================================= */

updateFromDropdown();
updateToDropdown();

document.querySelectorAll(".custom-select").forEach(select=>{
    const button = select.querySelector(".select-button");

    button.addEventListener("click",event=>{
        event.stopPropagation();
        toggleDropdown(select);
    });

    button.addEventListener("keydown",event=>{
        if(event.key === "Enter" || event.key === " "){
            event.preventDefault();
            toggleDropdown(select);
        }

        if(event.key === "Escape"){
            closeDropdown(select);
        }
    });
});

/* =========================================
   CLICK OUTSIDE
========================================= */

document.addEventListener("click",()=>{
    document.querySelectorAll(".custom-select").forEach(select=>{
        closeDropdown(select);
    });
});

/* =========================================
   VALIDATION
========================================= */

function isValidNumber(value){
    if(value === "" || value === "+" || value === "-"){
        return false;
    }

    /* Mendukung titik atau koma desimal */
    if(!/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(value.replace(",","."))){
        return false;
    }

    return Number.isFinite(Number(value.replace(",",".")));
}

/* =========================================
   FORMAT RESULT
========================================= */

function formatResult(value){
    if(!Number.isFinite(value)){
        return null;
    }

    if(value === 0){
        return "0";
    }

    return Number(value.toPrecision(15)).toString();
}

/* =========================================
   CONVERT
========================================= */

function convert(){
    let value = inputNumber.value.trim();

    error.style.display = "none";

    if(value === ""){
        result.textContent = "-";
        return;
    }

    if(!isValidNumber(value)){
        result.textContent = "-";
        error.textContent = "Masukkan angka yang valid.";
        error.style.display = "block";
        return;
    }

    value = value.replace(",", ".");

    const number = Number(value);

    /* Input ke meter, kemudian meter ke satuan tujuan */
    const meters = number * units[fromUnit].factor;
    const converted = meters / units[toUnit].factor;
    const formatted = formatResult(converted);

    if(formatted === null){
        result.textContent = "-";
        error.textContent = "Hasil konversi berada di luar batas angka.";
        error.style.display = "block";
        return;
    }

    result.textContent = formatted;
}

/* =========================================
   INPUT LISTENER
========================================= */

inputNumber.addEventListener("input",convert);

/* =========================================
   SWAP UNITS
========================================= */

swapBtn.addEventListener("click",()=>{
    const oldFrom = fromUnit;
    const oldTo = toUnit;

    const currentResult = result.textContent.trim();

    fromUnit = oldTo;
    toUnit = oldFrom;

    if(currentResult !== "-" && currentResult !== ""){
        inputNumber.value = currentResult;
    }

    updateFromDropdown();
    updateToDropdown();
    convert();
});

/* =========================================
   INITIAL
========================================= */

convert();

if(window.lucide){
    lucide.createIcons();
}
</script></body>
</html>
