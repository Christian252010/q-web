<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="template.css">
  <title>Rata-rata</title>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-title="Rata-rata">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

.sidebarr-search input{
  width: 103.5% !important;
}

body{
  background: var(--bg);
  color: var(--text);
  display:flex;
  justify-content:center;
  flex-wrap: wrap;
  padding:20px;
}

.container{
  margin-top: 50px;
  width:100%;
  max-width:700px;
  background: var(--card);
  border-radius:10px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
}

h1{
  text-align:center;
  margin-bottom:20px;
}

textarea{
  width:100%;
  min-height:120px;
  resize:none;
  border:none;
  outline:none;
  border-radius:8px;
  padding:15px;
  font-size:18px;
  background:var(--sp);
  color:var(--text);
}

#output{
  min-height:80px;
}

.middle{
  display:flex;
  justify-content:center;
  margin:15px 0;
}

.swap{
  display:flex;
  justify-content:center;
  align-items:center;
  border:none;
  background:none;
  color:var(--text);
  font-size:28px;
  cursor:pointer;
  transition:transform 0.3s ease;
  -webkit-tap-highlight-color:transparent;
}

.swap:hover{
  transform:scale(1.1);
}

.label{
  margin-bottom:4px;
  font-size:16px;
  margin-left:4px;
  opacity:0.7;
  font-weight:bold;
}

#copyBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:white;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

#copyBtn:active{
  transform:scale(1.02);
}

.topbar{
  display:flex;
  justify-content:flex-end;
  margin-right:2px;
  margin-bottom:-4px;
}

#resetBtn{
  position:absolute;
  width:18px;
  height:18px;
  border:none;
  border-radius:8px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.7;
  transition:.2s;
  z-index:6;
  -webkit-tap-highlight-color:transparent;
}

#resetBtn:active{
  transform:scale(.96);
}
</style>

<div id="fetch-container"></div>

<div class="container">

  <div class="topbar">
    <button id="resetBtn">
      <i data-lucide="rotate-ccw"></i>
    </button>
  </div>

  <div class="label">Angka</div>
  <textarea
    inputmode="decimal"
    id="input"
    placeholder="Masukkan angka"
  ></textarea>

<!--  <div class="middle">
    <button class="swap" id="swap">
      <i data-lucide="arrow-up-down"></i>
    </button>
  </div>-->

  <div class="label">Rata-rata</div>
  <textarea
    id="output"
    placeholder="Hasil..."
    readonly
  ></textarea>

<!--  <button id="copyBtn">
    <i data-lucide="copy"></i>
    <span>Copy Hasil</span>
  </button>-->

</div>

<script src="fetch.js"></script>

<script>
lucide.createIcons();

const input = document.getElementById("input");
const output = document.getElementById("output");
const swapBtn = document.getElementById("swap");
const resetBtn = document.getElementById("resetBtn");
const copyBtn = document.getElementById("copyBtn");

let mode = "average";

/* =========================
   HITUNG RATA-RATA
========================= */

function calculateAverage(text){

  // Pisahkan berdasarkan ENTER
  const lines = text.split(/\r?\n/);

  // Ubah setiap baris menjadi angka
  const numbers = lines
    .map(line => line.trim())
    .filter(line => line !== "")
    .map(line => Number(line.replace(",", ".")))
    .filter(number => !isNaN(number));

  // Jika tidak ada angka
  if(numbers.length === 0){
    return "";
  }

  // Hitung jumlah
  const total = numbers.reduce((sum, number) => {
    return sum + number;
  }, 0);

  // Hitung rata-rata
  const average = total / numbers.length;

  return average;
}


/* =========================
   CONVERT
========================= */

function convert(){

  if(mode === "average"){

    const result = calculateAverage(input.value);

    if(result === ""){
      output.value = "";
      return;
    }

    // Maksimal 2 angka di belakang koma
    output.value = Number(result.toFixed(2));

  }

}


/* =========================
   INPUT
========================= */

input.addEventListener("input", () => {

  // Hanya izinkan angka, koma, titik dan enter
  input.value = input.value.replace(/[^\d.,\n-]/g, "");

  convert();

});


/* =========================
   SWAP
========================= */

swapBtn.addEventListener("click", () => {

  const temp = input.value;

  input.value = output.value;
  output.value = temp;

  convert();

});


/* =========================
   COPY
========================= */

copyBtn.addEventListener("click", () => {

  navigator.clipboard.writeText(output.value);

});


/* =========================
   RESET
========================= */

resetBtn.addEventListener("click", () => {

  input.value = "";
  output.value = "";

});
</script>

</body>
</html>
