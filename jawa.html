<body data-title="Aksara Jawa">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

.sidebarr-search input{
  width:103.5% !important;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:20px;
}

.container{
  margin-top:50px;
  width:100%;
  max-width:700px;
  background:var(--card);
  border-radius:10px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
}

textarea{
  width:100%;
  min-height:80px;
  resize:none;
  border:none;
  outline:none;
  border-radius:8px;
  padding:15px;
  font-size:18px;
  background:var(--sp);
  color:var(--text);
}

#output{
  font-family:
    "Noto Sans Javanese",
    "Javanese Text",
    "Noto Sans",
    Arial,
    sans-serif;
}

.middle{
  display:flex;
  justify-content:center;
  margin:15px 0;
}

.swap{
  display:flex;
  justify-content:center;
  align-items:center;

  border:none;
  background:none;

  color:var(--text);
  font-size:28px;

  cursor:pointer;

  transition:transform .3s ease;

  -webkit-tap-highlight-color:transparent;
}

.swap:hover{
  transform:scale(1.1);
}

.label{
  margin-bottom:4px;
  font-size:16px;
  margin-left:4px;
  opacity:.7;
  font-weight:bold;
}

#copyBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  width:100%;

  margin-top:12px;

  padding:14px;

  border:none;
  border-radius:8px;

  background:var(--accent);
  color:white;

  font-weight:600;
  font-size:16px;

  cursor:pointer;

  transition:.3s;
}

#copyBtn:active{
  transform:scale(1.02);
}

.topbar{
  display:flex;
  justify-content:flex-end;

  margin-right:2px;
  margin-bottom:-4px;
}

#resetBtn{
  position:absolute;

  width:18px;
  height:18px;

  border:none;
  border-radius:8px;

  background:transparent;
  color:var(--text);

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:.7;

  transition:.2s;

  z-index:6;

  -webkit-tap-highlight-color:transparent;
}

#resetBtn:active{
  transform:scale(.96);
}

/* =========================================================
   KEYBOARD VIRTUAL AKSARA JAWA
========================================================= */

.jawa-keyboard{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  display:none;

  padding:
    8px
    max(12px, env(safe-area-inset-right))
    calc(12px + env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));

  background:var(--card);

  border-top:
    1px solid
    rgba(128,128,128,.25);

  box-shadow:
    0 -4px 18px
    rgba(0,0,0,.25);

  z-index:9999;

  user-select:none;

  -webkit-user-select:none;

}


/* =========================================================
   ROW
========================================================= */

.keyboard-row{
  display:grid;
  gap:5px;
  margin-bottom:5px;
}

.jawa-keyboard.mode-1 .keyboard-row{
  grid-template-columns:repeat(8, minmax(0, 1fr));
}

.jawa-keyboard.mode-2 .keyboard-row{
  grid-template-columns:repeat(10, minmax(0, 1fr));
}

/* =========================================================
   BOTTOM
========================================================= */

.keyboard-bottom{
  display:grid;

  grid-template-columns:
    60px 1fr 60px;

  gap:5px;
}


/* =========================================================
   BUTTON
========================================================= */

.keyboard-key{
  width:100%;
  min-width:0;
  height:42px;
  padding:0;

  border:none;
  border-radius:6px;

  background:var(--sp);
  color:var(--text2);

  font-size:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;

  transition:
    transform .08s ease,
    background .12s ease;
}


.keyboard-key:active{

  transform:scale(.94);

}


/* =========================================================
   SPASI
========================================================= */

.keyboard-space{
  font-family:Arial,sans-serif;
  font-size:14px;
  background: var(--accent);
  color: white;
}

.keyboard-enter{
  font-family:Arial,sans-serif;
  font-size:22px;
  font-weight:bold;
  background: var(--accent);
  color: white;
}


/* =========================================================
   SWITCH
========================================================= */

.keyboard-switch{
  font-family:Arial,sans-serif;
  font-size:22px;
  font-weight:bold;
  background: var(--accent);
  color: white;
}


/* =========================================================
   LAYAR KECIL
========================================================= */

@media(max-width:500px){

  .keyboard-row{

    grid-template-columns:
      repeat(10,1fr);

  }

  .keyboard-key{

    height:44px;

    font-size:19px;

  }

}


/* =========================================================
   LAYAR SANGAT KECIL
========================================================= */

@media(max-width:360px){

  .keyboard-key{

    height:42px;

    font-size:17px;

  }

  .keyboard-bottom{

    grid-template-columns:
      1fr 52px;

  }

}

#input[readonly]{
  caret-color:var(--text);
  caret-width: 2px;
}

.input-wrapper{
  position:relative;
}

.custom-caret{
  position:relative;

  width:1px;
  height:20px;
  margin-top: 8px;

  background:var(--text);

  pointer-events:none;

  animation:caretBlink 1s step-end infinite;

  display:none;

  z-index:10;
}

@keyframes caretBlink{
  50%{
    opacity:0;
  }
}
</style>

<script>
/* =========================================================
   KEYBOARD JAWA
========================================================= */

const jawaKeyboard =
  document.getElementById("jawaKeyboard");

const keyboardRow1 =
  document.getElementById("keyboardRow1");

const keyboardRow2 =
  document.getElementById("keyboardRow2");

const keyboardRow3 =
  document.getElementById("keyboardRow3");

const keyboardRow4 =
  document.getElementById("keyboardRow4");

const keyboardSpace =
  document.getElementById("keyboardSpace");

const keyboardSwitch =
  document.getElementById("keyboardSwitch");

const keyboardEnter =
  document.getElementById("keyboardEnter");

const customCaret =
  document.getElementById("customCaret");

function updateCustomCaret(){

  if(mode !== "jawaToLatin"){
    customCaret.style.display = "none";
    return;
  }

  const cursor =
    input.selectionStart;

  const text =
    input.value.substring(0,cursor);

  /*
    Buat elemen sementara untuk
    mengukur posisi cursor.
  */

  const mirror =
    document.createElement("div");

  const style =
    window.getComputedStyle(input);

  mirror.style.position = "absolute";
  mirror.style.visibility = "hidden";
  mirror.style.whiteSpace = "pre-wrap";
  mirror.style.wordWrap = "break-word";

  mirror.style.font =
    style.font;

  mirror.style.fontSize =
    style.fontSize;

  mirror.style.lineHeight =
    style.lineHeight;

  mirror.style.padding =
    style.padding;

  mirror.style.border =
    style.border;

  mirror.style.width =
    input.clientWidth + "px";

  mirror.style.boxSizing =
    "border-box";

  mirror.textContent =
    text;

  const marker =
    document.createElement("span");

  marker.textContent = "\u200b";

  mirror.appendChild(marker);

  document.body.appendChild(mirror);


  const markerRect =
    marker.getBoundingClientRect();

  const inputRect =
    input.getBoundingClientRect();


  let left =
    markerRect.left -
    inputRect.left -
    input.scrollLeft;

  let top =
    markerRect.top -
    inputRect.top -
    input.scrollTop;


  /*
    Sesuaikan dengan posisi textarea
  */

  customCaret.style.left =
    left + "px";

  customCaret.style.top =
    top + "px";

  customCaret.style.display =
    "block";


  document.body.removeChild(mirror);

}
/* =========================================================
   LAYOUT KEYBOARD
========================================================= */

const keyboardLayouts = [

  /* =======================================================
     MODE 1
  ======================================================= */

  [
    [
      "ꦲ","ꦤ","ꦕ","ꦫ",
      "ꦏ","ꦶ","ꦴ","꧀"
    ],
  
    [
      "ꦢ","ꦠ","ꦱ","ꦮ",
      "ꦭ","ꦸ","ꦂ","ꦿ"
    ],
  
    [
      "ꦥ","ꦝ","ꦗ","ꦪ",
      "ꦚ","ꦼ","ꦃ","ꦾ"
    ],
  
    [
      "ꦩ","ꦒ","ꦧ","ꦛ",
      "ꦔ","ꦺ","ꦁ","⌫"
    ]
  ],


  /* =======================================================
     MODE 2
  ======================================================= */

  [
    [
      "꧑","꧒","꧓","꧔","꧕",
      "꧖","꧗","꧘","꧙","꧐"
    ],
  
    [
      "ꦄ","ꦅ","ꦈ","ꦌ","ꦍ",
      "ꦎ","꧈","꧉","꧊","꧋"
    ],
  
    [
      "@","#","$","_","&",
      "-","+","(",")","/"
    ],
  
    [
      "*",":",";",
      "!","?",",",".","~","꧇","⌫"
    ]
  ]

];


let keyboardMode = 0;

/* =========================================================
   RENDER KEYBOARD
========================================================= */

function renderKeyboard(){

  const layout =
    keyboardLayouts[keyboardMode];

  /* ================================
     ATUR JUMLAH KOLOM
  ================================= */

  jawaKeyboard.classList.remove(
    "mode-1",
    "mode-2"
  );

  jawaKeyboard.classList.add(
    keyboardMode === 0
      ? "mode-1"
      : "mode-2"
  );


  const rows = [
    keyboardRow1,
    keyboardRow2,
    keyboardRow3,
    keyboardRow4
  ];


  rows.forEach(
    (row,rowIndex)=>{

      row.innerHTML = "";

      layout[rowIndex].forEach(
        key=>{

          const button =
            document.createElement("button");

          button.type = "button";

          button.className =
            "keyboard-key";

          if(
            keyboardMode === 0 &&
            isPasanganMode() &&
            isJawaBaseChar(key)
          ){
          
            /*
              Tampilkan bentuk pasangan
              pada keyboard.
          
              Yang ditampilkan:
              ꧀ + aksara
          
              Tetapi saat diklik,
              yang dimasukkan tetap hanya
              aksara dasarnya.
            */
          
            button.textContent =
              SANDHANGAN.PANGKON + key;
          
          }
          else{
          
            button.textContent =
              key;
          
          }

          if(key === "⌫"){
          
            let deleteTimer = null;
          
            const startDelete = (e) => {
          
              e.preventDefault();
          
              /*
                Hapus pertama
              */
              deleteJawaKey();
          
          
              /*
                Mulai repeat setelah 600ms
              */
              deleteTimer = setTimeout(() => {
          
                deleteTimer = setInterval(() => {
          
                  deleteJawaKey();
          
                }, 80);
          
              }, 600);
          
            };
          
          
            const stopDelete = () => {
          
              if(deleteTimer){
          
                clearTimeout(deleteTimer);
                clearInterval(deleteTimer);
          
                deleteTimer = null;
          
              }
          
              /*
                BARU render setelah tombol dilepas.
                
                Jadi renderKeyboard() tidak
                menghancurkan tombol ketika
                pointer masih ditekan.
              */
              renderKeyboard();
          
            };
          
          
            button.addEventListener(
              "pointerdown",
              startDelete
            );
          
            button.addEventListener(
              "pointerup",
              stopDelete
            );
          
            button.addEventListener(
              "pointerleave",
              stopDelete
            );
          
            button.addEventListener(
              "pointercancel",
              stopDelete
            );
          
          
          }
          else{
          
            button.addEventListener(
              "click",
              ()=>{
          
                insertJawaKey(key);
          
              }
            );
          
          }

          row.appendChild(button);

        }
      );

    }
  );

}

function isJawaBaseChar(key){

  return Object.values(aksara).includes(key);

}

function isPasanganMode(){

  if(keyboardMode !== 0)
    return false;

  const cursor =
    input.selectionStart;

  const value =
    input.value;

  if(cursor === 0)
    return false;
  
  return value[cursor - 1] === SANDHANGAN.PANGKON;
}

/* =========================================================
   INSERT KEY
========================================================= */

function insertJawaKey(key){

  const start =
    input.selectionStart;

  const end =
    input.selectionEnd;

  const value =
    input.value;


  /*
    Jika mode 1 dan karakter sebelumnya
    adalah pangkon ꧀, berarti aksara yang
    dimasukkan setelahnya adalah pasangan.
  */

  if(
    keyboardMode === 0 &&
    isJawaBaseChar(key) &&
    start > 0 &&
    value[start - 1] === "꧀"
  ){

    /*
      Tidak perlu menambahkan ꧀ lagi.

      Cukup masukkan aksara dasar.
      Unicode/font akan membentuk pasangan:
      
      ꦏ꧀ + ꦤ
      = ꦏ꧀ꦤ
    */

  }


  input.value =
    value.slice(0,start) +
    key +
    value.slice(end);


  const position =
    start + key.length;


  input.focus();

  input.setSelectionRange(
    position,
    position
  );


  convert();
  
  updateCustomCaret();
  
  renderKeyboard();

}

keyboardSpace.addEventListener(
  "click",
  ()=>{

    insertJawaKey(" ");

  }
);

keyboardEnter.addEventListener(
  "click",
  ()=>{

    insertJawaKey("\n");

  }
);

keyboardSwitch.addEventListener(
  "click",
  ()=>{

    keyboardMode++;

    if(
      keyboardMode >=
      keyboardLayouts.length
    ){

      keyboardMode = 0;

    }


    renderKeyboard();

  }
);

function deleteJawaKey(){

  const start =
    input.selectionStart;

  const end =
    input.selectionEnd;

  const value =
    input.value;


  /* =========================================
     JIKA ADA TEKS YANG DIPILIH
  ========================================= */

  if(start !== end){

    input.value =
      value.slice(0,start) +
      value.slice(end);

    input.focus();

    input.setSelectionRange(
      start,
      start
    );

    convert();

    updateCustomCaret();

    return;
  }


  /* =========================================
     JIKA CURSOR DI AWAL
  ========================================= */

  if(start === 0){

    return;

  }


  /* =========================================
     HAPUS 1 KARAKTER
  ========================================= */

  input.value =
    value.slice(0,start - 1) +
    value.slice(end);


  const position =
    start - 1;


  input.focus();

  input.setSelectionRange(
    position,
    position
  );


  convert();

  updateCustomCaret();

}

function showCustomCaret(){

  updateCustomCaret();

}

input.addEventListener("click",()=>{
  updateCustomCaret();
  renderKeyboard();
});

input.addEventListener("keyup",()=>{
  updateCustomCaret();
  renderKeyboard();
});

input.addEventListener("select",()=>{
  updateCustomCaret();
  renderKeyboard();
});

input.addEventListener("scroll",()=>{
  updateCustomCaret();
});

</script>

function getVowel(text,index){

    }

}


/* =========================================================

function getConsonant(text,index){

    if(text.startsWith(key,index)){

      return key;

    }

}


/* =========================================================
   SANDHANGAN SWARA
========================================================= */

const sandhangan = {

  i:  "ꦶ",

  u:  "ꦸ",

  e:  "ꦺ",

  é:  "ꦺ",

  ê: "ꦼ",

const SANDHANGAN = {

};


/* =========================================================

========================================================= */

const aksaraSwara = {

  u:  "ꦈ",
  e:  "ꦌ",
  é:  "ꦌ",

};


const swaraToLatin = {

};


/* =========================================================
   ANGKA
========================================================= */

const angkaJawa = {

const angkaLatin = {

  "꧗":"7",
  "꧘":"8",
  "꧙":"9"

};


/* =========================================================
   TANDA BACA
========================================================= */

const tandaBaca = {

  ".":"꧉",
  ",":"꧈",
  ":":"꧇",
  ";":"꧈",
  "!":"꧊",
  "?":"꧋"

};


const tandaBacaLatin = {

  "꧉":".",
  "꧈":",",
  "꧊":"!",
  "꧋":"?"

};


/* =========================================================
   SANDHANGAN → VOKAL
========================================================= */

function readVowelFromJawa(text,index){

  /*
    Taling + tarung = o
  */

  if(
    text[index] === SANDHANGAN.TALING &&
    text[index + 1] === SANDHANGAN.TARUNG
  ){

    return {
      vowel:"o",
      length:2
    };

  }


  if(text[index] === SANDHANGAN.WULU){

    return {
      vowel:"i",
      length:1
    };

  }


  if(text[index] === SANDHANGAN.SUKU){

    return {
      vowel:"u",
      length:1
    };

  }


  if(text[index] === SANDHANGAN.TALING){

    return {
      vowel:"e",
      length:1
    };

  }


  if(text[index] === SANDHANGAN.PEPET){

    return {
      vowel:"ê",
      length:1
    };

  }


  return {
    vowel:"a",
    length:0
  };

}


/* =========================================================
   LATIN → AKSARA JAWA
========================================================= */

function convertWord(word){

  let result = "";
  let i = 0;

  word = word.toLowerCase();

  while(i < word.length){

    /* =========================================
       ANGKA
    ========================================= */

    if(/\d/.test(word[i])){

      let angka = "";

      while(
        i < word.length &&
        /\d/.test(word[i])
      ){

        angka += angkaJawa[word[i]];

        i++;

      }

      result += "꧇" + angka + "꧇";

      continue;
    }


    /* =========================================
       TANDA BACA
    ========================================= */

    if(tandaBaca[word[i]]){

      result += tandaBaca[word[i]];

      i++;

      continue;
    }


    /* =========================================
       VOKAL AWAL
    ========================================= */

    const firstVowel = getVowel(word,i);

    if(firstVowel){

      result += aksaraSwara[firstVowel];

      i += firstVowel.length;

      continue;
    }


    /* =========================================
       KONSONAN
    ========================================= */

    const consonant = getConsonant(word,i);

    if(!consonant){

      result += word[i];

      i++;

      continue;
    }

    i += consonant.length;


    /* =========================================
       CEK R MATI
    =========================================

       Contoh:

       harga
       h a r g a
           ↑
         layar

       hasil:
       ꦲꦂꦒ
    */

    if(consonant === "r"){

      /*
        Kalau setelah r bukan vokal,
        berarti r merupakan konsonan mati.

        Jangan menghasilkan ꦫ + pangkon.

        Tetapi gunakan layar pada aksara
        sebelumnya.
      */

      const nextVowel = getVowel(word,i);

      if(!nextVowel){

        /*
          Hapus pangkon sebelumnya jika ada.

          Dalam kasus seperti:

          ... + ꦲ + ꦫ

          kita tidak ingin:

          ꦲꦫ꧀

          melainkan:

          ꦲꦂ
        */

        result += SANDHANGAN.LAYAR;

        continue;
      }
    }


    /* =========================================
       PENGKAL
    ========================================= */

    if(word[i] === "y"){

      const vowelAfterY =
        getVowel(word,i + 1);

      if(vowelAfterY){

        result +=
          aksara[consonant] +
          SANDHANGAN.PENGKAL;

        if(vowelAfterY !== "a"){

          result +=
            sandhangan[vowelAfterY];

        }

        i +=
          1 + vowelAfterY.length;

        continue;
      }
    }


    /* =========================================
       CAKRA
    ========================================= */

    if(word[i] === "r"){

      const vowelAfterR =
        getVowel(word,i + 1);

      if(vowelAfterR){

        /*
          krê
        */

        if(vowelAfterR === "ê"){

          result +=
            aksara[consonant] +
            SANDHANGAN.CAKRA_KERET;

        }

        else{

          result +=
            aksara[consonant] +
            SANDHANGAN.CAKRA;

          if(vowelAfterR !== "a"){

            result +=
              sandhangan[vowelAfterR];

          }

        }

        i +=
          1 + vowelAfterR.length;

        continue;
      }
    }


    /* =========================================
       VOKAL
    ========================================= */

    const vowel =
      getVowel(word,i);


    /* =========================================
       TIDAK ADA VOKAL
    ========================================= */

    if(!vowel){

      /*
        H akhir / mati
        → wignyan
      */

      if(consonant === "h"){

        result +=
          aksara[consonant] +
          SANDHANGAN.WIGNYAN;

        continue;
      }


      /*
        R sudah ditangani di atas.
      */


      /*
        Konsonan mati biasa
        → pangkon
      */

      result +=
        aksara[consonant] +
        SANDHANGAN.PANGKON;

      continue;
    }


    /* =========================================
       AKSARA + VOKAL
    ========================================= */

    result +=
      aksara[consonant] +
      sandhangan[vowel];

    i += vowel.length;


    /* =========================================
       CECAK AKHIR
    ========================================= */

    if(
      word.startsWith("ng",i) &&
      i + 2 === word.length
    ){

      result +=
        SANDHANGAN.CECAK;

      i += 2;

      continue;
    }


    /* =========================================
       LAYAR AKHIR
    ========================================= */

    if(
      word[i] === "r" &&
      i + 1 === word.length
    ){

      result +=
        SANDHANGAN.LAYAR;

      i++;

      continue;
    }


    /* =========================================
       WIGNYAN AKHIR
    ========================================= */

    if(
      word[i] === "h" &&
      i + 1 === word.length
    ){

      result +=
        SANDHANGAN.WIGNYAN;

      i++;

      continue;
    }

  }

  return result;
}


/* =========================================================
   LATIN → JAWA
========================================================= */

function latinToJawa(text){

  let result = "";

  let i = 0;


  while(i < text.length){


    /* =========================================
       ANGKA + SPASI
    ========================================= */

    if(/\d/.test(text[i])){

      let angka = "";


      while(i < text.length){

        if(/\d/.test(text[i])){

          angka +=
            angkaJawa[text[i]];

          i++;

          continue;

        }


        if(/\s/.test(text[i])){

          let j = i;


          while(
            j < text.length &&
            /\s/.test(text[j])
          ){

            j++;

          }


          if(
            j < text.length &&
            /\d/.test(text[j])
          ){

            angka +=
              text.slice(i,j);

            i = j;

            continue;

          }

        }


        break;

      }


      result +=
        "꧇" +
        angka +
        "꧇";

      continue;

    }


    /* =========================================
       SPASI
    ========================================= */

    if(/\s/.test(text[i])){

      result += text[i];

      i++;

      continue;

    }


    /* =========================================
       KATA
    ========================================= */

    let start = i;


    while(
      i < text.length &&
      !/\s/.test(text[i]) &&
      !/\d/.test(text[i])
    ){

      i++;

    }


    result +=
      convertWord(
        text.slice(start,i)
      );

  }


  return result;

}


/* =========================================================
   MEMBACA SATU AKSARA JAWA
========================================================= */

function readJawaSyllable(text,index){

  const base =
    jawaCharToLatin[text[index]];


  if(base === undefined){

    return null;

  }


  let i = index + 1;

  let latin = base;

  let hasVowel = false;

  let hasPangkon = false;


  /* =========================================
     CAKRA
  ========================================= */

  if(text[i] === SANDHANGAN.CAKRA){

    latin += "r";

    i++;

  }


  /* =========================================
     CAKRA KERET
  ========================================= */

  else if(
    text[i] === SANDHANGAN.CAKRA_KERET
  ){

    latin += "rê";

    i++;

    hasVowel = true;

  }


  /* =========================================
     PENGKAL
  ========================================= */

  else if(
    text[i] === SANDHANGAN.PENGKAL
  ){

    latin += "y";

    i++;

  }


  /* =========================================
     VOKAL
  ========================================= */

  const vowel =
    readVowelFromJawa(text,i);


  if(vowel.length > 0){

    latin += vowel.vowel;

    i += vowel.length;

    hasVowel = true;

  }


  /* =========================================
     CECAK
  ========================================= */

    if(text[i] === SANDHANGAN.CECAK){
    
      /*
        Aksara dasar tanpa sandhangan
        mempunyai vokal bawaan "a".
    
        ꦏꦁ
        = kang
    
        bukan kng
      */
    
      if(!hasVowel){
    
        latin += "a";
    
      }
    
      latin += "ng";
    
      i++;
    
      return {
        text:latin,
        next:i
      };
    
    }


  /* =========================================
     LAYAR
  ========================================= */

  if(text[i] === SANDHANGAN.LAYAR){

    /*
      ꦏꦂ = kar

      BUKAN kr
    */

    if(!hasVowel){

      latin += "a";

    }

    latin += "r";

    i++;

    return {
      text:latin,
      next:i
    };

  }


  /* =========================================
     WIGNYAN
  ========================================= */

  if(text[i] === SANDHANGAN.WIGNYAN){

    if(!hasVowel){

      latin += "a";

    }

    latin += "h";

    i++;

    return {
      text:latin,
      next:i
    };

  }


  /* =========================================
     PANGKON
  ========================================= */

  if(text[i] === SANDHANGAN.PANGKON){

    hasPangkon = true;

    i++;

    /*
      Pangkon berarti konsonan mati.
    */

    return {
      text:latin,
      next:i
    };

  }


  /* =========================================
     VOKAL BAWAAN
  ========================================= */

  if(!hasVowel){

    /*
      ꦏꦿ = kra
      ꦏꦾ = kya

      Jadi aksara dengan cakra/pengkal
      tetap mempunyai vokal a.
    */

    latin += "a";

  }


  return {
    text:latin,
    next:i
  };

}


/* =========================================================
   JAWA → LATIN
========================================================= */

function jawaToLatin(text){

  let result = "";

  let i = 0;


  while(i < text.length){

    const char =
      text[i];


    /* =========================================
       ANGKA
    ========================================= */

    if(char === "꧇"){

      /*
        Pastikan ini benar-benar pembuka
        angka, bukan tanda baca biasa.
      */

      let j = i + 1;

      let containsNumber = false;


      while(
        j < text.length &&
        text[j] !== "꧇"
      ){

        if(
          angkaLatin[text[j]] !== undefined
        ){

          containsNumber = true;

        }

        else if(
          !/\s/.test(text[j])
        ){

          break;

        }

        j++;

      }


      if(
        containsNumber &&
        text[j] === "꧇"
      ){

        let angka = "";

        i++;


        while(
          i < text.length &&
          text[i] !== "꧇"
        ){

          if(
            angkaLatin[text[i]] !== undefined
          ){

            angka +=
              angkaLatin[text[i]];

          }

          else{

            /*
              Spasi di antara angka
              tetap dipertahankan.
            */

            angka += text[i];

          }

          i++;

        }


        if(text[i] === "꧇"){

          i++;

        }


        result += angka;

        continue;

      }


      /*
        Kalau bukan blok angka,
        anggap sebagai tanda titik dua.
      */

      result += ":";

      i++;

      continue;

    }


    /* =========================================
       TANDA BACA
    ========================================= */

    if(
      tandaBacaLatin[char] !== undefined
    ){

      result +=
        tandaBacaLatin[char];

      i++;

      continue;

    }


    /* =========================================
       AKSARA SWARA
    ========================================= */

    if(
      swaraToLatin[char] !== undefined
    ){

      result +=
        swaraToLatin[char];

      i++;

      continue;

    }


    /* =========================================
       AKSARA DASAR
    ========================================= */

    const syllable =
      readJawaSyllable(
        text,
        i
      );


    if(syllable){

      result +=
        syllable.text;

      i =
        syllable.next;

      continue;

    }


    /* =========================================
       SPASI / KARAKTER LAIN
    ========================================= */

    result += char;

    i++;

  }


  return result;

}


/* =========================================================
   ELEMENT HTML
========================================================= */

const input =
  document.getElementById("input");

const output =
  document.getElementById("output");

const swapBtn =
  document.getElementById("swap");

const resetBtn =
  document.getElementById("resetBtn");

const copyBtn =
  document.getElementById("copyBtn");

const inputLabel =
  document.getElementById("inputLabel");

const outputLabel =
  document.getElementById("outputLabel");


/* =========================================================
   MODE
========================================================= */

let mode =
  "latinToJawa";
  
function showJawaKeyboard(){

  jawaKeyboard.style.display = "block";

  renderKeyboard();

}

function hideJawaKeyboard(){

  jawaKeyboard.style.display = "none";

}


/* =========================================================
   CONVERT
========================================================= */

function convert(){

  if(mode === "latinToJawa"){

    output.value =
      latinToJawa(
        input.value
      );

  }

  else if(mode === "jawaToLatin"){

    output.value =
      jawaToLatin(
        input.value
      );

  }

}


/* =========================================================
   INPUT
========================================================= */

input.addEventListener(
  "input",
  ()=>{
    convert();
  }
);


/* =========================================================
   SWAP
========================================================= */

swapBtn.addEventListener("click",()=>{

  /*
    Simpan teks berdasarkan mode saat ini.
    
    Mode latinToJawa:
      input  = Latin
      output = Jawa

    Mode jawaToLatin:
      input  = Jawa
      output = Latin
  */

  if(mode === "latinToJawa"){

    /*
      Latin → Jawa
      Saat swap:
      input  menjadi hasil Jawa
      output menjadi teks Latin
    */

    const latinText =
      input.value;

    const jawaText =
      output.value;


    input.value =
      jawaText;

    output.value =
      latinText;


    mode =
      "jawaToLatin";


    inputLabel.textContent =
      "Aksara Jawa";

    outputLabel.textContent =
      "Teks Latin";


    input.style.fontFamily =
      '"Noto Sans Javanese", "Javanese Text", sans-serif';

    output.style.fontFamily =
      'Arial, sans-serif';


    /* ================================
       TAMPILKAN KEYBOARD
    ================================= */

    showJawaKeyboard();


    /*
      Matikan keyboard HP
    */

    input.setAttribute(
      "readonly",
      ""
    );

  }

  else{

    /*
      Jawa → Latin
      Saat swap:
      input  menjadi hasil Latin
      output menjadi teks Jawa
    */

    const jawaText =
      input.value;

    const latinText =
      output.value;


    input.value =
      latinText;

    output.value =
      jawaText;


    mode =
      "latinToJawa";


    inputLabel.textContent =
      "Teks Latin";

    outputLabel.textContent =
      "Aksara Jawa";


    input.style.fontFamily =
      'Arial, sans-serif';

    output.style.fontFamily =
      '"Noto Sans Javanese", "Javanese Text", sans-serif';


    /* ================================
       SEMBUNYIKAN KEYBOARD
    ================================= */

    hideJawaKeyboard();


    /*
      Aktifkan kembali keyboard HP
    */

    input.removeAttribute(
      "readonly"
    );

  }


  /*
    Jangan panggil convert() di sini.

    Karena isi input/output sudah merupakan
    hasil swap yang benar.
  */


  input.focus();

});


/* =========================================================
   COPY
========================================================= */

copyBtn.addEventListener(
  "click",
  async ()=>{

    if(!output.value)
      return;


    try{

      await navigator.clipboard.writeText(
        output.value
      );

    }

    catch(error){

      output.select();

      document.execCommand(
        "copy"
      );

    }

  }
);


/* =========================================================
   RESET
========================================================= */

resetBtn.addEventListener(
  "click",
  ()=>{

    input.value = "";

    output.value = "";

  }
);

renderKeyboard();
</script>
